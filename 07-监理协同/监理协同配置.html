<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>工程检查人员配置</title>
<style>
:root {
    --bg: #0b1220;
    --card: #141c33;
    --border: #2a3655;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --primary: #3b82f6;
}
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont;
    background: radial-gradient(circle at top, #141c33, #0b1220);
    color: var(--text);
    padding: 40px;
}
.container { max-width: 1100px; margin: auto; }
h1 { text-align: center; margin-bottom: 6px; }
.sub { text-align: center; color: var(--muted); margin-bottom: 32px; }

.table {
    background: var(--card);
    border-radius: 12px;
    border: 1px solid var(--border);
    overflow: hidden;
}
.row {
    display: grid;
    grid-template-columns: 180px 1fr 1fr;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
}
.row.head {
    background: rgba(255,255,255,.05);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 12px;
    cursor: default;
}
.row:not(.head):hover { background: rgba(255,255,255,.04); }

.tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 13px;
    margin: 2px 4px 2px 0;
}
.inspector { background: rgba(59,130,246,.25); }
.reinspector { background: rgba(34,197,94,.25); }
.avatar-sm {
    width: 22px; height: 22px;
    border-radius: 50%;
    object-fit: cover;
}

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    display: none;
    place-items: center;
    z-index: 100;
}
.modal.show { display: grid; }
.box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    width: 720px;
    padding: 24px;
}
.search {
    width: 100%;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #0b1220;
    color: #fff;
    margin-bottom: 16px;
}
.cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
    max-height: 360px;
    overflow: auto;
}
.person-card {
    background: #0f172a;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    cursor: pointer;
}
.person-card:hover { border-color: var(--primary); }
.person-card.selected { border-color: var(--primary); background: rgba(59,130,246,.15); }
.person-card img {
    width: 44px; height: 44px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 10px;
}
.p-name { font-weight: 600; }
.p-role { font-size: 12px; color: var(--muted); margin: 2px 0; }
.p-phone { font-size: 12px; color: #60a5fa; }

.actions {
    text-align: right;
    margin-top: 20px;
}
button {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
}
.ok { background: var(--primary); color: #fff; }
.cancel { background: #374151; color: #fff; margin-right: 10px; }
</style>
</head>
<body>

<div class="container">
<h1>工程检查人员配置</h1>
<div class="sub">点击单元格配置检查 / 复检人员</div>

<div class="table">
    <div class="row head">
        <div>检查方面</div>
        <div>检查人员</div>
        <div>复检人员</div>
    </div>
    <div id="rows"></div>
</div>
</div>

<div class="modal" id="modal">
    <div class="box">
        <h3 id="title"></h3>
        <input class="search" id="search" placeholder="搜索姓名 / 电话">
        <div class="cards" id="cards"></div>
        <div class="actions">
            <button class="cancel" onclick="closeModal()">取消</button>
            <button class="ok" onclick="save()">确定</button>
        </div>
    </div>
</div>

<script>
const checks = ["地形测量","地质勘察","结构设计","建筑施工","永久设施","机电安装","信号通讯"];

const people = [
    { name:"张三", role:"测量工程师", phone:"13800000001", avatar:"https://api.dicebear.com/7.x/pixel-art/svg?seed=A" },
    { name:"李四", role:"岩土工程师", phone:"13800000002", avatar:"https://api.dicebear.com/7.x/pixel-art/svg?seed=B" },
    { name:"王五", role:"结构工程师", phone:"13800000003", avatar:"https://api.dicebear.com/7.x/pixel-art/svg?seed=C" },
    { name:"赵六", role:"建筑工程师", phone:"13800000004", avatar:"https://api.dicebear.com/7.x/pixel-art/svg?seed=D" },
    { name:"陈工", role:"机电总监", phone:"13800000005", avatar:"https://api.dicebear.com/7.x/pixel-art/svg?seed=E" },
    { name:"刘工", role:"信号工程师", phone:"13800000006", avatar:"https://api.dicebear.com/7.x/pixel-art/svg?seed=F" }
];

let state = {};
let ctx = {};

checks.forEach(c => {
    state[c] = { inspector:[], reinspector:[] };
});

const rows = document.getElementById("rows");
checks.forEach(c => {
    rows.innerHTML += `
    <div class="row">
        <div>${c}</div>
        <div onclick="openModal('${c}','inspector')" id="${c}_inspector">点击选择</div>
        <div onclick="openModal('${c}','reinspector')" id="${c}_reinspector">点击选择</div>
    </div>`;
});

function openModal(check, type){
    ctx = { check, type };
    document.getElementById("title").innerText = check + " · " + (type==="inspector"?"检查人员":"复检人员");
    renderCards();
    document.getElementById("modal").classList.add("show");
}

function renderCards(){
    const q = document.getElementById("search").value.toLowerCase();
    document.getElementById("cards").innerHTML = people.filter(p =>
        p.name.includes(q) || p.phone.includes(q)
    ).map(p => {
        const sel = state[ctx.check][ctx.type].find(x=>x.name===p.name);
        return `
        <div class="person-card ${sel?'selected':''}" onclick="togglePerson('${p.name}')">
            <img src="${p.avatar}">
            <div class="p-name">${p.name}</div>
            <div class="p-role">${p.role}</div>
            <div class="p-phone">${p.phone}</div>
        </div>
        `;
    }).join("");
}

function togglePerson(name){
    const list = state[ctx.check][ctx.type];
    const person = people.find(p=>p.name===name);
    state[ctx.check][ctx.type] = list.find(p=>p.name===name)
        ? list.filter(p=>p.name!==name)
        : [...list, person];
    renderCards();
}

function save(){
    ["inspector","reinspector"].forEach(t=>{
        const el = document.getElementById(ctx.check+"_"+t);
        el.innerHTML = state[ctx.check][t].length
            ? state[ctx.check][t].map(p=>`
                <span class="tag ${t}">
                    <img class="avatar-sm" src="${p.avatar}">${p.name}
                </span>`).join("")
            : "点击选择";
    });
    closeModal();
}

function closeModal(){
    document.getElementById("modal").classList.remove("show");
}
</script>

</body>
</html>
