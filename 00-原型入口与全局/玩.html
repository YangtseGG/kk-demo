<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>全息战机 × 宇宙战舰</title>
<style>
  *{margin:0;padding:0;overflow:hidden}
  body{background:#020510;font-family:'Segoe UI',system-ui,sans-serif}
  canvas{display:block}

  /*── HUD 浮层 ──*/
  #hud{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    display:flex;gap:12px;z-index:10;
  }
  #hud button{
    padding:8px 22px;
    border:1px solid rgba(0,220,255,.45);
    border-radius:6px;
    background:rgba(0,20,40,.65);
    color:#7ef9ff;font-size:14px;letter-spacing:.6px;
    cursor:pointer;backdrop-filter:blur(6px);
    transition:.2s;
  }
  #hud button:hover,#hud button.active{
    background:rgba(0,180,255,.18);color:#fff;
    box-shadow:0 0 18px rgba(0,200,255,.35);
  }

  #info{
    position:fixed;top:18px;left:50%;transform:translateX(-50%);
    color:rgba(140,225,255,.55);font-size:12px;letter-spacing:1.2px;
    pointer-events:none;text-transform:uppercase;
  }
</style>
</head>
<body>

<div id="info">◆ 全息战术投影系统 ◆ 拖拽旋转 · 滚轮缩放</div>

<div id="hud">
  <button class="active" onclick="showModel(0)">✷ 星际战机</button>
  <button onclick="showModel(1)">⬡ 宇宙战舰</button>
</div>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ===== 场景 ===== */
const scene  = new THREE.Scene();
scene.fog     = new THREE.FogExp2(0x020510, 0.012);
scene.background = new THREE.Color(0x020510);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 400);
camera.position.set(0, 6, 22);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.prepend(renderer.domElement);

const ctrl = new OrbitControls(camera, renderer.domElement);
ctrl.enableDamping = true;
ctrl.dampingFactor = 0.06;
ctrl.minDistance = 8;
ctrl.maxDistance = 50;

/* ===== 星光粒子背景 ===== */
function createStarfield(count=3000){
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const r = 60+Math.random()*80;
    const θ = Math.random()*Math.PI*2;
    const φ = Math.acos(2*Math.random()-1);
    pos[i*3]   = r*Math.sin(φ)*Math.cos(θ);
    pos[i*3+1] = r*Math.sin(φ)*Math.sin(θ);
    pos[i*3+2] = r*Math.cos(φ);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const mat = new THREE.PointsMaterial({
    size:0.18, color:0x88bbff,
    transparent:true, opacity:0.7,
    depthWrite:false, blending:THREE.AdditiveBlending
  });
  scene.add(new THREE.Points(geo,mat));
}
createStarfield();

/* ===== 全息 Shader ===== */
const holoVert = /* glsl */`
  varying vec3 vWorldPos;
  varying vec3 vNormal;
  varying float vDisp;

  uniform float uTime;

  //
  // 微颤动：制造"不稳定投影"手感
  //
  void main(){
    vec3 p = position;

    // 沿法线微小抖动
    float jitter = sin(p.y*12.0+uTime*3.0)*cos(p.x*9.0+uTime*2.1)*0.06;
    // 偶尔的小 glitch 跳变
    float glitch = step(0.985, fract(sin(uTime*0.7+p.y*3.0)*43758.5453))
                 * (sin(uTime*13.0+p.z*7.0)>0.0?1.0:-1.0)
                 * 0.12;
    p += normal * (jitter + glitch);

    vec4 worldPos = modelMatrix * vec4(p,1.0);
    vWorldPos = worldPos.xyz;
    vNormal  = normalize(normalMatrix * normal);

    gl_Position = projectionMatrix * viewMatrix * worldPos;
  }
`;

const holoFrag = /* glsl */`
  varying vec3 vWorldPos;
  varying vec3 vNormal;

  uniform float uTime;
  uniform vec3  uColor;
  uniform float uScanSpeed;
  uniform float uFresnelPow;

  void main(){
    // ---- Fresnel 边缘光 ----
    vec3 viewDir = normalize(cameraPosition - vWorldPos);
    float fresnel = 1.0 - abs(dot(viewDir, vNormal));
    fresnel = pow(fresnel, uFresnelPow);

    // ---- 扫描线 ----
    float scan = fract(vWorldPos.y*1.6 - uTime*uScanSpeed);
    float scanLine = smoothstep(0.0, 0.08, scan) * smoothstep(1.0, 0.92, scan);

    // ---- 水平网格暗线 ----
    float hLine = smoothstep(0.0,0.02, abs(fract(vWorldPos.y*3.5)-0.5))*0.5+0.5;

    // ---- 颜色合成 ----
    float glow = fresnel*0.85 + scanLine*0.55;
    vec3 col = uColor * (0.25 + glow*1.1);
    col += vec3(0.08,0.22,0.38)*hLine;           // 冷暗条纹
    col += fresnel * vec3(0.35,0.75,1.0)*0.35;   // 边缘偏蓝白

    // 闪烁
    float flicker = 0.93 + 0.07*sin(uTime*8.0 + vWorldPos.x*20.0);

    float alpha = (0.18 + glow*0.82) * flicker;
    alpha = clamp(alpha, 0.08, 0.95);

    gl_FragColor = vec4(col, alpha);
  }
`;

function makeHoloMat(colorHex=0x00d8ff){
  return new THREE.ShaderMaterial({
    vertexShader:   holoVert,
    fragmentShader: holoFrag,
    uniforms:{
      uTime:      {value:0},
      uColor:     {value:new THREE.Color(colorHex)},
      uScanSpeed: {value:1.4},
      uFresnelPow:{value:2.8},
    },
    transparent:true,
    depthWrite:false,
    side:THREE.DoubleSide,
    blending:THREE.AdditiveBlending,
  });
}

/* ===== 程序化建模：星际战机 ===== */
function buildFighter(){
  const group = new THREE.Group();

  // 辅助：拉伸轮廓成对称机身
  function extrudeSymm(points, halfDepth, opts={}){
    // 简易：沿 Z 正负方向挤出（手工建 BufferGeo 太冗长，用 LatheGeometry 思路替代）
    // 这里改用 Shape + ExtrudeGeometry 沿单侧镜像
    const shape = new THREE.Shape();
    points.forEach((p,i)=> i===0 ? shape.moveTo(...p) : shape.lineTo(...p) );
    shape.lineTo(0, 0);   // 封底（三角扇近似）
    const geo = new THREE.LatheGeometry(
      points.map(p=>new THREE.Vector2(p[0],p[1])),
      24
    );
    return geo;
  }

  // — 主机身：Lathe 旋转体 —
  const bodyProfile = [
    [0.00, -3.2],
    [0.42, -2.6],
    [0.55, -1.0],
    [0.62,  0.4],
    [0.45,  1.8],
    [0.28,  2.6],
    [0.12,  3.1],
    [0.00,  3.2],
  ];
  const bodyPts = bodyProfile.map(p=>new THREE.Vector2(p[0],p[1]));
  const bodyGeo = new THREE.LatheGeometry(bodyPts, 28);
  const bodyMat = makeHoloMat(0x34e8ff);
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  group.add(body);

  // — 主机翼（左）—
  function wingShape(){
    const s = new THREE.Shape();
    s.moveTo(0, -0.4);
    s.lineTo(2.8, -0.9);
    s.lineTo(3.1, -0.3);
    s.lineTo(2.4,  0.5);
    s.lineTo(0.3,  0.6);
    s.lineTo(0,   -0.1);
    return s;
  }
  const wingGeo = new THREE.ExtrudeGeometry(wingShape(), {
    depth:0.06, bevelEnabled:false
  });
  wingGeo.center();

  // 左翼
  const wingL = new THREE.Mesh(wingGeo, makeHoloMat(0x2ad4ff));
  wingL.position.set(0.55, 0, -0.05);
  wingL.rotation.x = 0.08;
  group.add(wingL);

  // 右翼（镜像）
  const wingR = new THREE.Mesh(wingGeo.clone(), makeHoloMat(0x2ad4ff));
  wingR.position.set(-0.55, 0, -0.05);
  wingR.scale.x = -1;
  wingR.rotation.x = 0.08;
  group.add(wingR);

  // — 鸭翼（前小翼）—
  const canardGeo = new THREE.BoxGeometry(1.6, 0.06, 0.5);
  const canardMat = makeHoloMat(0x40e0ff);
  const canardL = new THREE.Mesh(canardGeo, canardMat);
  canardL.position.set(0.38, 0, 2.2);
  canardL.rotation.z = -0.2;
  group.add(canardL);
  const canardR = new THREE.Mesh(canardGeo, canardMat);
  canardR.position.set(-0.38, 0, 2.2);
  canardR.rotation.z = 0.2;
  group.add(canardR);

  // — 尾翼（垂直安定面）—
  const tailGeo = new THREE.BoxGeometry(0.06, 1.1, 0.7);
  const tail = new THREE.Mesh(tailGeo, makeHoloMat(0x28ccff));
  tail.position.set(0, 0.55, -2.6);
  group.add(tail);

  // — 引擎发光环 —
  const ringGeo = new THREE.TorusGeometry(0.38, 0.055, 12, 32);
  const ringMat = makeHoloMat(0x66ffff);
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.set(0, 0, -3.0);
  ring.rotation.x = Math.PI/2;
  group.add(ring);

  group.userData.holoMats = collectHolo(group);
  return group;
}

/* ===== 程序化建模：宇宙战舰 ===== */
function buildCapitalShip(){
  const group = new THREE.Group();
  const c = (hex)=> makeHoloMat(hex);

  // 主体：胶囊拉长
  const hullGeo = new THREE.CapsuleGeometry(0.9, 6, 12, 32);
  const hull = new THREE.Mesh(hullGeo, c(0x30c8ff));
  hull.scale.set(1, 1, 2.8);
  hull.rotation.x = Math.PI/2;
  group.add(hull);

  // 上部舰桥结构
  const bridgeGeo = new THREE.BoxGeometry(1.2, 0.9, 2.0);
  const bridge = new THREE.Mesh(bridgeGeo, c(0x38d0ff));
  bridge.position.set(0, 0.85, 2.0);
  group.add(bridge);

  // 舰桥顶塔
  const towerGeo = new THREE.CylinderGeometry(0.18, 0.25, 1.2, 8);
  const tower = new THREE.Mesh(towerGeo, c(0x50e8ff));
  tower.position.set(0, 1.5, 2.8);
  group.add(tower);

  // 主翼 — 左右大型翼面
  function mainWing(){
    const s = new THREE.Shape();
    s.moveTo(0, 0);
    s.lineTo(5.0, -0.6);
    s.lineTo(5.5,  0.1);
    s.lineTo(4.2,  0.8);
    s.lineTo(0.6,  0.9);
    s.closePath();
    return s;
  }
  const mwGeo = new THREE.ExtrudeGeometry(mainWing(), {depth:0.1, bevelEnabled:false});
  mwGeo.center();
  [-1,1].forEach(side=>{
    const w = new THREE.Mesh(mwGeo.clone(), c(0x28beff));
    w.position.set(side*0.95, 0, -1.0);
    w.scale.x = side;
    w.rotation.x = 0.05;
    group.add(w);
  });

  // 下方突出推进段
  const thrusterGeo = new THREE.CylinderGeometry(0.7, 0.55, 1.8, 16);
  const thruster = new THREE.Mesh(thrusterGeo, c(0x22bbee));
  thruster.rotation.x = Math.PI/2;
  thruster.position.set(0, 0, -4.5);
  group.add(thruster);

  // 推进口环
  const tRing = new THREE.Mesh(
    new THREE.TorusGeometry(0.55, 0.06, 10, 32),
    c(0x55eeff)
  );
  tRing.position.set(0,0,-5.5);
  tRing.rotation.x = Math.PI/2;
  group.add(tRing);

  // 小型炮塔（装饰点）
  for(const off of [{x:2.2,z:-0.5},{x:-2.2,z:-0.5},{x:1.5,z:1.5},{x:-1.5,z:1.5}]){
    const b = new THREE.Mesh(
      new THREE.BoxGeometry(0.35,0.25,0.35),
      c(0x44ddff)
    );
    b.position.set(off.x, 0.55, off.z);
    group.add(b);
  }

  // 顶部传感器阵列
  const sensor = new THREE.Mesh(
    new THREE.ConeGeometry(0.18, 0.6, 6),
    c(0x66ffff)
  );
  sensor.position.set(0, 1.9, 3.6);
  group.add(sensor);

  group.userData.holoMats = collectHolo(group);
  return group;
}

/* ===== 收集所有全息材质方便更新 ===== */
function collectHolo(obj){
  const mats=[];
  obj.traverse(n=>{ if(n.isMesh && n.material?.uniforms?.uTime!==undefined) mats.push(n.material); });
  return mats;
}

/* ===== 构建并切换 ===== */
let currentModel = null;
let targetScale  = 1;

const fighter     = buildFighter();
const capitalShip = buildCapitalShip();

// 初始缩放适配
fighter.scale.setScalar(0.9);
capitalShip.scale.setScalar(0.28);
capitalShip.rotation.y = 0.3;

window.showModel = function(idx){
  document.querySelectorAll('#hud button').forEach((b,i)=> b.classList.toggle('active', i===idx));
  if(currentModel) scene.remove(currentModel);
  currentModel = idx===0 ? fighter : capitalShip;
  scene.add(currentModel);
};

showModel(0);

/* ===== 底座全息圆盘 ===== */
(function addBaseRing(){
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(5.5, 0.03, 8, 128),
    new THREE.ShaderMaterial({
      vertexShader:`
        varying vec3 vPos;
        void main(){
          vPos = (modelMatrix*vec4(position,1.0)).xyz;
          gl_Position = projectionMatrix*viewMatrix*modelMatrix*vec4(position,1.0);
        }`,
      fragmentShader:`
        varying vec3 vPos;
        uniform float uTime;
        void main(){
          float scan = fract(vPos.x*0.8 - vPos.y*0.5 - uTime*0.6);
          float a = smoothstep(0.,.15,scan)*smoothstep(1.,.85,scan)*0.45 + 0.06;
          gl_FragColor = vec4(vec3(0.25,0.75,1.0), a);
        }`,
      uniforms:{uTime:{value:0}},
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide
    })
  );
  ring.rotation.x = -Math.PI/2;
  ring.position.y = -3.35;
  scene.add(ring);
  window.__baseRing = ring;
})();

/* ===== 动画循环 ===== */
const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const t = clock.getElapsedTime();
  const dt = clock.getDelta();

  // 更新所有全息材质的 uTime
  [fighter, capitalShip].forEach(m=>{
    (m.userData.holoMats||[]).forEach(mat=>{ mat.uniforms.uTime.value = t; });
  });
  if(window.__baseRing) window.__baseRing.material.uniforms.uTime.value = t;

  // 模型漂浮旋转
  if(currentModel){
    currentModel.rotation.y += 0.003;
    currentModel.position.y = Math.sin(t*0.7)*0.25;
  }

  ctrl.update();
  renderer.render(scene, camera);
}
tick();

/* ===== resize ===== */
window.addEventListener('resize',()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
