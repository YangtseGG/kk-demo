<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg-track: #f5f5f5;
            --color-save: #52c41a;    /* 绿色：节约 */
            --color-excess: #ff4d4f;  /* 红色：超量 */
            --color-target: #faad14;  /* 橙色：预期值 */
            --text-main: #262626;
            --text-sub: #8c8c8c;
        }

        body { font-family: sans-serif; padding: 50px; background: #fafafa; }

        .table-cell {
            width: 280px;
            background: #fff;
            padding: 16px;
            border: 1px solid #eee;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        /* 顶部文字布局 */
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 12px;
        }

        .actual-box .label { font-size: 12px; color: var(--text-sub); display: block; }
        .actual-value { font-size: 18px; font-weight: bold; color: var(--text-main); }
        .total-goal { font-size: 12px; color: var(--text-sub); }

        /* 状态标签 */
        .status-tag {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        .tag-save { background: #f6ffed; color: var(--color-save); border: 1px solid #b7eb8f; }
        .tag-excess { background: #fff1f0; color: var(--color-excess); border: 1px solid #ffa39e; }

        /* 进度条容器 */
        .progress-wrapper {
            position: relative;
            height: 12px;
            background: var(--bg-track);
            border-radius: 6px;
            cursor: help;
        }

        /* 实际进度填充 */
        .progress-bar {
            height: 100%;
            border-radius: 6px;
            transition: width 0.4s cubic-bezier(0.075, 0.82, 0.165, 1);
        }

        /* 预期值刻度线 (橙色) */
        .target-marker {
            position: absolute;
            top: -4px;
            bottom: -4px;
            width: 3px;
            background: var(--color-target);
            border-radius: 2px;
            z-index: 2;
            box-shadow: 0 0 4px rgba(250, 173, 20, 0.4);
        }

        /* Tooltip 气泡提示 (CSS实现) */
        .progress-wrapper:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 20px;
            left: var(--marker-pos);
            transform: translateX(-50%);
            background: #313131;
            color: #fff;
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 4px;
            white-space: nowrap;
            z-index: 10;
        }

        .progress-wrapper:hover::before {
            content: '';
            position: absolute;
            bottom: 15px;
            left: var(--marker-pos);
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: #313131;
        }

        .divider { margin: 40px 0; border: none; border-top: 1px solid #eee; }
    </style>
</head>
<body>

    <div class="table-cell">
        <div class="info-row">
            <div class="actual-box">
         <span class="total-goal"">当前消耗：</span>
                <span class="actual-value">350</span> <span class="status-tag tag-save">🟢 节约</span>
            </div>
    
            <span class="total-goal">总预算量: 1000 pcs</span>
        </div>
        <div class="progress-wrapper" style="--marker-pos: 60%;" data-tooltip="预期消耗: 600">
            <div class="target-marker" style="left: 60%;"></div>
            <div class="progress-bar" style="width: 35%; background: var(--color-save);"></div>
        </div>
    </div>

    <div class="divider"></div>

    <div class="table-cell">
        <div class="info-row">
            <div class="actual-box">
                <span class="total-goal"">当前消耗：</span>
                <span class="actual-value">820</span> <span class="status-tag tag-excess">🔴 超量</span>
            </div>
            <span class="total-goal">总预算量: 1000 pcs</span>
        </div>
        <div class="progress-wrapper" style="--marker-pos: 60%;" data-tooltip="预期消耗: 600">
            <div class="target-marker" style="left: 60%;"></div>
            <div class="progress-bar" style="width: 82%; background: var(--color-excess);"></div>
        </div>
    </div>

    <p style="color: #999; font-size: 12px; margin-top: 20px;">* 鼠标悬停在进度条上查看橙色线的预期数值</p>

</body>
</html>
