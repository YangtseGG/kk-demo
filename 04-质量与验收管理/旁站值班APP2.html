<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工地通 - 旁站值班APP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .app-container {
            width: 100%;
            max-width: 400px;
            height: 90vh;
            background-color: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        /* 状态栏 */
        .status-bar {
            background-color: #1e5799;
            color: white;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
        }
        
        /* 顶部导航 */
        .app-header {
            background: linear-gradient(135deg, #1e5799 0%, #207cca 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e5799;
            font-weight: bold;
        }
        
        .user-name {
            font-size: 18px;
            font-weight: 600;
        }
        
        .user-role {
            font-size: 13px;
            opacity: 0.9;
        }
        
        .notification-badge {
            position: relative;
        }
        
        .notification-icon {
            font-size: 20px;
        }
        
        .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: #ff5252;
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        
        /* 月份导航 */
        .month-nav {
            background-color: #f0f4f9;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .nav-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
        }
        
        .current-month {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        /* 日历视图 */
        .calendar-view {
            padding: 15px;
            flex-grow: 1;
            overflow-y: auto;
        }
        
        .calendar-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            margin-bottom: 10px;
            font-weight: 600;
            color: #5a6a7e;
        }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }
        
        .calendar-day {
            height: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .calendar-day:hover {
            background-color: #edf2ff;
        }
        
        .day-number {
            font-size: 16px;
            font-weight: 500;
        }
        
        .day-name {
            font-size: 10px;
            opacity: 0.7;
        }
        
        .current-day {
            background-color: #1e5799;
            color: white;
        }
        
        .duty-day {
            background-color: #e8f4ff;
            border: 1px solid #0d6efd;
        }
        
        .duty-indicator {
            position: absolute;
            bottom: 5px;
            width: 5px;
            height: 5px;
            background-color: #0d6efd;
            border-radius: 50%;
        }
        
        /* 值班详情面板 */
        .detail-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: white;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
            padding: 20px;
            transform: translateY(100%);
            transition: transform 0.3s ease-out;
            z-index: 10;
            max-height: 70vh;
            overflow-y: auto;
        }
        
        .detail-panel.active {
            transform: translateY(0);
        }
        
        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .detail-title {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        .close-detail {
            background: none;
            border: none;
            font-size: 24px;
            color: #6c757d;
            cursor: pointer;
        }
        
        .detail-date {
            font-size: 16px;
            color: #1e5799;
            margin-bottom: 15px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .duty-list {
            margin-top: 15px;
        }
        
        .duty-item {
            background-color: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #1e5799;
        }
        
        .duty-item.new {
            border-left: 4px solid #ff5252;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 82, 82, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(255, 82, 82, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 82, 82, 0); }
        }
        
        .duty-category {
            font-size: 16px;
            font-weight: 600;
            color: #1e5799;
            margin-bottom: 8px;
        }
        
        .duty-content {
            font-size: 14px;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        
        .duty-location {
            background-color: #e8f4ff;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 10px;
        }
        
        .duty-personnel {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        
        .personnel-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #1e5799;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        
        .personnel-name {
            font-weight: 500;
        }
        
        .no-duties {
            text-align: center;
            padding: 30px;
            color: #6c757d;
        }
        
        /* 底部导航 */
        .app-footer {
            display: flex;
            justify-content: space-around;
            background-color: #fff;
            border-top: 1px solid #eaeaea;
            padding: 10px 0;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            color: #6c757d;
        }
        
        .nav-item.active {
            color: #1e5799;
        }
        
        .nav-icon {
            font-size: 20px;
            margin-bottom: 3px;
        }
        
        /* 通知中心 */
        .notification-center {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            display: none;
            z-index: 100;
        }
        
        .notification-container {
            background-color: white;
            width: 90%;
            max-width: 350px;
            border-radius: 15px;
            overflow: hidden;
            margin: 20% auto;
        }
        
        .notification-header {
            background: linear-gradient(135deg, #1e5799 0%, #207cca 100%);
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .notification-title {
            font-size: 18px;
            font-weight: 600;
        }
        
        .notification-body {
            padding: 20px;
            max-height: 50vh;
            overflow-y: auto;
        }
        
        .notification-item {
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }
        
        .notification-item:last-child {
            border-bottom: none;
        }
        
        .notification-time {
            font-size: 12px;
            color: #6c757d;
            margin-bottom: 5px;
        }
        
        .notification-content {
            font-size: 14px;
            line-height: 1.4;
        }
        
        .notification-highlight {
            color: #1e5799;
            font-weight: 500;
        }
        
        .close-notification {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }
        
        /* 遮罩层 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: none;
            z-index: 5;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="status-bar">
            <div>9:41</div>
            <div>
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi" style="margin:0 5px"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>
        
        <div class="app-header">
            <div class="user-info">
                <div class="user-avatar">朱</div>
                <div>
                    <div class="user-name">朱明星</div>
                    <div class="user-role">旁站值班工程师</div>
                </div>
            </div>
            <div class="notification-badge" id="notification-btn">
                <i class="fas fa-bell notification-icon"></i>
                <div class="badge">3</div>
            </div>
        </div>
        
        <div class="month-nav">
            <div class="nav-btn" id="prev-month">
                <i class="fas fa-chevron-left"></i>
            </div>
            <div class="current-month">2024年9月</div>
            <div class="nav-btn" id="next-month">
                <i class="fas fa-chevron-right"></i>
            </div>
        </div>
        
        <div class="calendar-view">
            <div class="calendar-header">
                <div>日</div>
                <div>一</div>
                <div>二</div>
                <div>三</div>
                <div>四</div>
                <div>五</div>
                <div>六</div>
            </div>
            <div class="calendar-grid" id="calendar-grid">
                <!-- 日历将通过JS生成 -->
            </div>
        </div>
        
        <!-- 值班详情面板 -->
        <div class="detail-panel" id="detail-panel">
            <div class="detail-header">
                <div class="detail-title">值班详情</div>
                <button class="close-detail" id="close-detail">&times;</button>
            </div>
            
            <div class="detail-date">
                <i class="far fa-calendar-alt"></i>
                <span id="selected-date">2024年9月10日（星期二）</span>
            </div>
            
            <div class="duty-list" id="duty-list">
                <!-- 值班详情将通过JS动态生成 -->
            </div>
        </div>
        
        <!-- 遮罩层 -->
        <div class="overlay" id="overlay"></div>
        
        <div class="app-footer">
            <div class="nav-item active">
                <i class="fas fa-calendar nav-icon"></i>
                <span>排班</span>
            </div>
            <div class="nav-item">
                <i class="fas fa-file-alt nav-icon"></i>
                <span>记录</span>
            </div>
            <div class="nav-item">
                <i class="fas fa-bell nav-icon"></i>
                <span>通知</span>
            </div>
            <div class="nav-item">
                <i class="fas fa-user nav-icon"></i>
                <span>我的</span>
            </div>
        </div>
        
        <!-- 通知中心 -->
        <div class="notification-center" id="notification-center">
            <div class="notification-container">
                <div class="notification-header">
                    <div class="notification-title">通知中心</div>
                    <button class="close-notification" id="close-notification">&times;</button>
                </div>
                <div class="notification-body">
                    <div class="notification-item">
                        <div class="notification-time">今天 08:30</div>
                        <div class="notification-content">
                            您的排班计划有更新：<span class="notification-highlight">框架桥工程</span> 值班时间调整为 9月8日-15日
                        </div>
                    </div>
                    <div class="notification-item">
                        <div class="notification-time">昨天 16:45</div>
                        <div class="notification-content">
                            新增排班任务：<span class="notification-highlight">路基工程</span> DK866+800-866+350路基填筑
                        </div>
                    </div>
                    <div class="notification-item">
                        <div class="notification-time">9月5日 09:20</div>
                        <div class="notification-content">
                            系统提醒：请及时提交上周的<span class="notification-highlight">旁站值班记录</span>
                        </div>
                    </div>
                    <div class="notification-item">
                        <div class="notification-time">9月3日 14:15</div>
                        <div class="notification-content">
                            会议通知：本周五下午3点召开<span class="notification-highlight">工地安全会议</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 值班数据（基于Excel表格）
            const dutyData = [
                {
                    id: 1,
                    category: "路基工程",
                    content: "DK866+800-866+350路基填筑",
                    dates: [8,9,10,11,12,13,14,15],
                    personnel: "ADAMU 朱明星",
                    location: "DK866+800-866+350"
                },
                {
                    id: 2,
                    category: "涵洞工程",
                    content: "DK866+200, DK864+320, DK845+191涵洞主体施工",
                    dates: [8,9,10,11,12,13,14,15],
                    personnel: "SHIZAH 朱明星",
                    location: "DK866+200, DK864+320, DK845+191"
                },
                {
                    id: 3,
                    category: "框架桥工程",
                    content: "DK845+191底板钢筋绑扎、浇筑",
                    dates: [8,9,10,11,12,13,14,15],
                    personnel: "ABDULAZEEZ 朱明星",
                    location: "DK845+191"
                },
                {
                    id: 4,
                    category: "桥梁工程",
                    content: "DK843墩柱施工, DK862钢站桥施工, DK856桩基施工",
                    dates: [8,9,10,11,12,13,14,15],
                    personnel: "SHIZAH 朱明星",
                    location: "DK843, DK862, DK856"
                }
            ];
            
            // 生成日历
            function generateCalendar(year, month) {
                const calendarGrid = document.getElementById('calendar-grid');
                calendarGrid.innerHTML = '';
                
                // 获取当月第一天是星期几（0-6，0为周日）
                const firstDay = new Date(year, month, 1).getDay();
                // 获取当月天数
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                
                // 填充空白（上个月的日期）
                for (let i = 0; i < firstDay; i++) {
                    const dayElement = document.createElement('div');
                    dayElement.className = 'calendar-day';
                    calendarGrid.appendChild(dayElement);
                }
                
                // 当前日期
                const today = new Date();
                const currentDate = today.getDate();
                const currentMonth = today.getMonth();
                const currentYear = today.getFullYear();
                
                // 收集所有值班日期
                const dutyDays = [];
                dutyData.forEach(duty => {
                    duty.dates.forEach(day => {
                        if (!dutyDays.includes(day)) {
                            dutyDays.push(day);
                        }
                    });
                });
                
                // 填充当月日期
                for (let day = 1; day <= daysInMonth; day++) {
                    const dayElement = document.createElement('div');
                    dayElement.className = 'calendar-day';
                    dayElement.dataset.day = day;
                    
                    // 添加日期数字
                    const dayNumber = document.createElement('div');
                    dayNumber.className = 'day-number';
                    dayNumber.textContent = day;
                    dayElement.appendChild(dayNumber);
                    
                    // 添加星期名称缩写
                    const dayName = document.createElement('div');
                    dayName.className = 'day-name';
                    const dayOfWeek = new Date(year, month, day).getDay();
                    const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
                    dayName.textContent = dayNames[dayOfWeek];
                    dayElement.appendChild(dayName);
                    
                    // 标记今天
                    if (day === currentDate && month === currentMonth && year === currentYear) {
                        dayElement.classList.add('current-day');
                    }
                    
                    // 标记值班日
                    if (dutyDays.includes(day)) {
                        dayElement.classList.add('duty-day');
                        
                        // 添加值班指示点
                        const dutyIndicator = document.createElement('div');
                        dutyIndicator.className = 'duty-indicator';
                        dayElement.appendChild(dutyIndicator);
                    }
                    
                    // 添加点击事件
                    dayElement.addEventListener('click', function() {
                        const selectedDay = parseInt(this.dataset.day);
                        showDutyDetails(year, month, selectedDay);
                    });
                    
                    calendarGrid.appendChild(dayElement);
                }
            }
            
            // 显示值班详情
            function showDutyDetails(year, month, day) {
                const date = new Date(year, month, day);
                const formattedDate = formatLongDate(date);
                document.getElementById('selected-date').textContent = formattedDate;
                
                // 查找当天的值班任务
                const dayDuties = dutyData.filter(duty => duty.dates.includes(day));
                
                const dutyList = document.getElementById('duty-list');
                dutyList.innerHTML = '';
                
                if (dayDuties.length === 0) {
                    dutyList.innerHTML = `
                        <div class="no-duties">
                            <i class="far fa-smile" style="font-size: 40px; margin-bottom: 10px;"></i>
                            <p>今日无值班任务</p>
                        </div>
                    `;
                } else {
                    dayDuties.forEach(duty => {
                        const dutyItem = document.createElement('div');
                        dutyItem.className = 'duty-item';
                        dutyItem.innerHTML = `
                            <div class="duty-category">${duty.category}</div>
                            <div class="duty-content">${duty.content}</div>
                            <div class="duty-location">${duty.location}</div>
                            <div class="duty-personnel">
                                <div class="personnel-avatar">${duty.personnel.charAt(0)}</div>
                                <div class="personnel-name">${duty.personnel}</div>
                            </div>
                        `;
                        dutyList.appendChild(dutyItem);
                    });
                }
                
                // 显示详情面板
                document.getElementById('detail-panel').classList.add('active');
                document.getElementById('overlay').style.display = 'block';
            }
            
            // 日期格式化函数
            function formatLongDate(date) {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                const weekday = weekdays[date.getDay()];
                return `${year}年${month}月${day}日（${weekday}）`;
            }
            
            // 初始化日历（2024年9月）
            generateCalendar(2024, 8); // 注意：月份从0开始，9月对应8
            
            // 月份导航
            document.getElementById('prev-month').addEventListener('click', function() {
                // 实际应用中这里会加载上个月的数据
                alert('加载上个月排班数据');
            });
            
            document.getElementById('next-month').addEventListener('click', function() {
                // 实际应用中这里会加载下个月的数据
                alert('加载下个月排班数据');
            });
            
            // 关闭详情面板
            document.getElementById('close-detail').addEventListener('click', function() {
                document.getElementById('detail-panel').classList.remove('active');
                document.getElementById('overlay').style.display = 'none';
            });
            
            // 点击遮罩层关闭详情面板
            document.getElementById('overlay').addEventListener('click', function() {
                document.getElementById('detail-panel').classList.remove('active');
                this.style.display = 'none';
            });
            
            // 通知中心
            const notificationBtn = document.getElementById('notification-btn');
            const notificationCenter = document.getElementById('notification-center');
            const closeNotification = document.getElementById('close-notification');
            
            notificationBtn.addEventListener('click', function() {
                notificationCenter.style.display = 'block';
                // 清除通知角标
                document.querySelector('.badge').style.display = 'none';
            });
            
            closeNotification.addEventListener('click', function() {
                notificationCenter.style.display = 'none';
            });
            
            // 模拟值班计划变更通知
            setTimeout(function() {
                const badge = document.querySelector('.badge');
                badge.textContent = '1';
                badge.style.display = 'flex';
                
                // 添加新通知
                const notificationBody = document.querySelector('.notification-body');
                const newNotification = document.createElement('div');
                newNotification.className = 'notification-item';
                newNotification.innerHTML = `
                    <div class="notification-time">刚刚</div>
                    <div class="notification-content">
                        紧急通知：<span class="notification-highlight">桥梁工程</span> 值班时间延长至9月20日
                    </div>
                `;
                notificationBody.insertBefore(newNotification, notificationBody.firstChild);
            }, 5000);
        });
    </script>
</body>
</html>
