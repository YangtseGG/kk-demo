<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>库存盘点原型</title>
    <style>
        :root {
            --primary: #1989fa;
            --success: #07c160;
            --text-main: #323233;
            --text-sub: #969799;
            --bg-body: #f7f8fa;
            --bg-white: #ffffff;
            --border: #ebedf0;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: -apple-system, sans-serif; background-color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        /* 手机外壳 */
        .mobile-wrapper {
            width: 375px; height: 720px; background-color: var(--bg-body); position: relative; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.1); border-radius: 20px;
        }

        /* 导航栏 */
        .navbar { height: 46px; background: var(--bg-white); display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--border); position: relative; z-index: 100;}
        .navbar-title { font-size: 16px; font-weight: 600; }
        .navbar-left { position: absolute; left: 16px; color: var(--primary); font-size: 14px; cursor: pointer; display: flex; align-items: center;}

        /* 列表容器 */
        .page-content { height: calc(100% - 46px); overflow-y: auto; padding: 12px; }

        /* 卡片样式 */
        .inventory-card {
            background: var(--bg-white); border-radius: 8px; padding: 16px; margin-bottom: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.02); display: flex; flex-direction: column;
        }
        .card-top { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .mat-name { font-size: 16px; font-weight: 600; color: var(--text-main); flex: 1; margin-right: 10px; }
        .mat-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #e8f3ff; color: var(--primary); height: fit-content;}
        
        .card-mid { font-size: 12px; color: var(--text-sub); margin-bottom: 12px; font-family: monospace; }
        
        .card-bottom { display: flex; justify-content: space-between; align-items: flex-end; border-top: 1px solid #f5f6f7; padding-top: 10px; }
        .qty-group { display: flex; align-items: baseline; }
        .qty-label { font-size: 12px; color: var(--text-sub); margin-right: 4px; }
        .qty-val { font-size: 20px; font-weight: 700; color: var(--text-main); font-family: DIN Alternate, Arial; }
        .qty-unit { font-size: 12px; color: var(--text-sub); margin-left: 2px; }

        /* 盘点按钮 */
        .btn-stocktake {
            padding: 6px 16px;
            background: #fff;
            border: 1px solid var(--primary);
            color: var(--primary);
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-stocktake:active { background: #e8f3ff; }

        /* --- 底部盘点弹窗 (Bottom Sheet) --- */
        .modal-mask {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 200;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-mask.visible { opacity: 1; pointer-events: auto; }

        .bottom-sheet {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: #fff; border-radius: 16px 16px 0 0;
            padding: 20px; z-index: 201;
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .modal-mask.visible .bottom-sheet { transform: translateY(0); }

        .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .sheet-title { font-size: 18px; font-weight: 600; }
        .sheet-close { color: #999; font-size: 20px; padding: 5px; cursor: pointer; }

        .stock-info-row { display: flex; justify-content: space-between; margin-bottom: 20px; background: #f7f8fa; padding: 12px; border-radius: 8px; }
        .info-block { text-align: center; flex: 1; }
        .info-label { font-size: 12px; color: #969799; margin-bottom: 4px; }
        .info-val { font-size: 16px; font-weight: 600; }

        .input-group { margin-bottom: 24px; }
        .input-label { font-size: 14px; font-weight: 500; margin-bottom: 8px; color: var(--text-main); }
        .input-field-wrapper { display: flex; align-items: center; border-bottom: 1px solid #ebedf0; padding-bottom: 8px; }
        .stock-input {
            border: none; outline: none; font-size: 24px; font-weight: 700; width: 100%; color: var(--primary);
            font-family: DIN Alternate, Arial; background: transparent;
        }
        .input-unit { font-size: 14px; color: var(--text-sub); }

        .btn-confirm {
            width: 100%; height: 44px; background: var(--primary); color: #fff;
            border: none; border-radius: 22px; font-size: 16px; font-weight: 500;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-confirm:active { opacity: 0.9; }

        /* Toast 提示 */
        .toast {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7); color: #fff; padding: 10px 20px; border-radius: 8px;
            font-size: 14px; z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.3s;
            display: flex; align-items: center; gap: 8px;
        }
        .toast.show { opacity: 1; }

    </style>
</head>
<body>

<div class="mobile-wrapper">
    <div class="navbar">
        <div class="navbar-left">
            <svg viewBox="0 0 1024 1024" width="20" height="20" fill="currentColor"><path d="M724 218.3V141c0-6.7-7.7-10.4-12.9-6.3L260.3 486.8a31.86 31.86 0 0 0 0 50.3l450.8 352.1c5.3 4.1 12.9.4 12.9-6.3v-77.3c0-4.9-2.3-9.6-6.1-12.6l-360-281 360-281.1c3.8-3 6.1-7.7 6.1-12.6z"/></svg>
        </div>
        <div class="navbar-title">A-01 货架明细</div>
    </div>

    <div class="page-content" id="listContainer">
        </div>

    <div class="modal-mask" id="stockModal">
        <div class="bottom-sheet">
            <div class="sheet-header">
                <div class="sheet-title">库存盘点</div>
                <div class="sheet-close" onclick="closeModal()">✕</div>
            </div>

            <div style="margin-bottom:15px; font-weight:600; font-size:15px;" id="modalMatName">--</div>
            
            <div class="stock-info-row">
                <div class="info-block" style="border-right:1px solid #ebedf0">
                    <div class="info-label">系统账面</div>
                    <div class="info-val" id="modalSysQty">0</div>
                </div>
                <div class="info-block">
                    <div class="info-label">差异数</div>
                    <div class="info-val" id="modalDiff" style="color:#969799">0</div>
                </div>
            </div>

            <div class="input-group">
                <div class="input-label">实盘数量</div>
                <div class="input-field-wrapper">
                    <input type="number" id="stockInput" class="stock-input" placeholder="输入实际数量" oninput="calcDiff()">
                    <span class="input-unit" id="modalUnit">个</span>
                </div>
            </div>

            <button class="btn-confirm" onclick="confirmStocktake()">确认盘点</button>
        </div>
    </div>

    <div class="toast" id="toast">
        <svg width="20" height="20" fill="none" stroke="#fff" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span>盘点成功</span>
    </div>
</div>

<script>
    // 模拟数据
    let inventoryData = [
        { id: 101, code: 'ELEC-202301', name: 'STM32F103C8T6 微控制器', category: '电子元器件', qty: 1200, unit: 'PCS' },
        { id: 102, code: 'ELEC-202305', name: '5.5寸 OLED 显示屏总成', category: '屏幕模组', qty: 45, unit: '片' },
        { id: 103, code: 'ACC-002', name: 'USB-C 充电接口母座', category: '连接器', qty: 5000, unit: '个' }
    ];

    let currentItem = null; // 当前正在盘点的对象

    // 渲染列表
    function renderList() {
        const container = document.getElementById('listContainer');
        container.innerHTML = '';
        
        inventoryData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'inventory-card';
            card.innerHTML = `
                <div class="card-top">
                    <div class="mat-name">${item.name}</div>
                    <span class="mat-tag">${item.category}</span>
                </div>
                <div class="card-mid">编码: ${item.code}</div>
                <div class="card-bottom">
                    <div class="qty-group">
                        <span class="qty-label">库存:</span>
                        <span class="qty-val">${item.qty}</span>
                        <span class="qty-unit">${item.unit}</span>
                    </div>
                    <button class="btn-stocktake" onclick="openStocktake(${item.id})">盘点</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // 打开盘点弹窗
    function openStocktake(id) {
        currentItem = inventoryData.find(i => i.id === id);
        if(!currentItem) return;

        // 填充弹窗数据
        document.getElementById('modalMatName').innerText = currentItem.name;
        document.getElementById('modalSysQty').innerText = currentItem.qty;
        document.getElementById('modalUnit').innerText = currentItem.unit;
        
        // 重置输入框
        const input = document.getElementById('stockInput');
        input.value = ''; 
        document.getElementById('modalDiff').innerText = '0';
        document.getElementById('modalDiff').style.color = '#969799';

        // 显示弹窗
        document.getElementById('stockModal').classList.add('visible');
        
        // 自动聚焦输入框 (延时为了动画流畅)
        setTimeout(() => input.focus(), 300);
    }

    // 关闭弹窗
    function closeModal() {
        document.getElementById('stockModal').classList.remove('visible');
        document.getElementById('stockInput').blur();
    }

    // 实时计算差异
    function calcDiff() {
        const inputVal = parseFloat(document.getElementById('stockInput').value);
        const sysVal = currentItem.qty;
        const diffEl = document.getElementById('modalDiff');
        
        if (isNaN(inputVal)) {
            diffEl.innerText = '0';
            diffEl.style.color = '#969799';
            return;
        }

        const diff = inputVal - sysVal;
        if (diff > 0) {
            diffEl.innerText = '+' + diff;
            diffEl.style.color = '#07c160'; // 盘盈 绿色
        } else if (diff < 0) {
            diffEl.innerText = diff;
            diffEl.style.color = '#ff4d4f'; // 盘亏 红色
        } else {
            diffEl.innerText = '0';
            diffEl.style.color = '#969799'; // 平
        }
    }

    // 确认盘点逻辑
    function confirmStocktake() {
        const inputVal = document.getElementById('stockInput').value;
        if (inputVal === '') return; // 简单校验

        const newQty = parseFloat(inputVal);
        
        // 1. 更新数据源
        currentItem.qty = newQty;
        
        // 2. 重新渲染列表以更新UI
        renderList();
        
        // 3. 关闭弹窗
        closeModal();
        
        // 4. 显示成功提示
        showToast();
    }

    function showToast() {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 2000);
    }

    // 初始化
    renderList();

</script>
</body>
</html>
