<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>建筑工人管理</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto; background:#f5f7fa; }
.header { background:#1a56db; color:white; padding:16px; position:sticky; top:0; z-index:20; }
.back-btn { background:none; border:none; color:white; font-size:16px; margin-right:10px; }
.tab-bar { display:flex; background:#fff; border-bottom:1px solid #eee; position:sticky; top:56px; z-index:10; }
.tab { flex:1; text-align:center; padding:14px 0; font-size:15px; color:#555; }
.tab.active { color:#1a56db; border-bottom:2px solid #1a56db; font-weight:600; }

.card { background:#fff; margin:12px; border-radius:12px; overflow:hidden; }
.section-title { font-size:15px; font-weight:600; color:#1a56db; padding:12px 15px 8px; }
.form-group { padding:12px 15px; }
.form-label { font-size:13px; color:#374151; margin-bottom:4px; display:flex; align-items:center; }
.required::before { content:'*'; color:#e53e3e; margin-right:4px; }
.form-input, .form-select, .text-area {
  width:100%; padding:10px; border:1px solid #d1d5db; border-radius:8px; font-size:14px; background:#fff;
}
.text-area { min-height:70px; resize:none; }
.upload-box { border:1px dashed #ccc; border-radius:8px; padding:20px; text-align:center; color:#777; font-size:13px; }

/* 状态标签 */
.status-badge { padding:4px 10px; border-radius:20px; font-size:12px; font-weight:600; }
.status-pending { background:#fef3c7; color:#92400e; }
.status-approved { background:#d1fae5; color:#065f46; }
.status-rejected { background:#fee2e2; color:#991b1b; }

/* 人员卡片 */
.worker-card { display:flex; align-items:center; padding:15px; border-bottom:1px solid #f3f4f6; }
.worker-card:last-child { border-bottom:none; }
.avatar { width:50px; height:50px; border-radius:50%; object-fit:cover; margin-right:12px; background:#e5e7eb; display:flex; align-items:center; justify-content:center; color:#9ca3af; font-size:20px; }
.worker-info { flex:1; }
.worker-name { font-weight:600; font-size:15px; }
.worker-meta { font-size:13px; color:#6b7280; margin-top:4px; }
.meta-item { margin-right:8px; }

.toggle-bar { display:flex; justify:flex-end; padding:10px 15px; background:#fff; position:sticky; top:104px; z-index:9; }
.bottom-bar {
  position:fixed; bottom:0; left:0; right:0; display:flex; gap:12px; padding:12px 15px; background:#fff;
  box-shadow:0 -2px 10px rgba(0,0,0,.08);
}
.btn { flex:1; padding:12px; border-radius:10px; font-size:15px; border:none; }
.btn-primary { background:#1a56db; color:#fff; }
.btn-success { background:#059669; color:#fff; }

/* 非必填控制 */
.optional { display:none; }
body.show-all .optional { display:block; }

/* 页面切换 */
.page { display:none; }
.page.active { display:block; }
</style>
</head>

<body>

<!-- ================= 总览页面 ================= -->
<div id="overviewPage" class="page active">
  <div class="header">
    <h1 class="text-xl font-bold">建筑工人管理</h1>
    <p class="text-sm opacity-90 mt-1">共 3 名工人，2 人待审核</p>
  </div>

  <div class="card">
    <div class="section-title">人员审核状态</div>
    
    <!-- 卡片 1 -->
    <div class="worker-card">
      <div class="avatar"><i class="fas fa-user"></i></div>
      <div class="worker-info">
        <div class="worker-name">张三</div>
        <div class="worker-meta">
          <span class="meta-item"><i class="fas fa-users mr-1"></i>钢筋班组</span>
          <span class="meta-item"><i class="fas fa-hammer mr-1"></i>钢筋工</span>
        </div>
      </div>
      <span class="status-badge status-pending">待审核</span>
    </div>
    
    <!-- 卡片 2 -->
    <div class="worker-card">
      <div class="avatar"><i class="fas fa-user"></i></div>
      <div class="worker-info">
        <div class="worker-name">李四</div>
        <div class="worker-meta">
          <span class="meta-item"><i class="fas fa-users mr-1"></i>模板班组</span>
          <span class="meta-item"><i class="fas fa-hammer mr-1"></i>木工</span>
        </div>
      </div>
      <span class="status-badge status-approved">已通过</span>
    </div>
    
    <!-- 卡片 3 -->
    <div class="worker-card">
      <div class="avatar"><i class="fas fa-user"></i></div>
      <div class="worker-info">
        <div class="worker-name">王五</div>
        <div class="worker-meta">
          <span class="meta-item"><i class="fas fa-users mr-1"></i>混凝土班组</span>
          <span class="meta-item"><i class="fas fa-hammer mr-1"></i>混凝土工</span>
        </div>
      </div>
      <span class="status-badge status-rejected">已驳回</span>
    </div>
  </div>

  <div class="bottom-bar">
    <button class="btn btn-success" id="addWorkerBtn">
      <i class="fas fa-plus mr-2"></i>新增人员
    </button>
  </div>
</div>

<!-- ================= 新增人员页面 ================= -->
<div id="entryPage" class="page">
  <div class="header flex items-center">
    <button class="back-btn" id="backBtn">
      <i class="fas fa-arrow-left"></i>
    </button>
    <h1 class="text-lg font-bold">新增建筑工人</h1>
  </div>

  <!-- TAB 切换 -->
  <div class="tab-bar">
    <div class="tab active" data-page="person">个人信息</div>
    <div class="tab" data-page="salary">工资信息</div>
  </div>

  <!-- 切换开关 -->
  <div class="toggle-bar">
    <label class="text-sm flex items-center">
      <input type="checkbox" id="toggle" checked class="mr-2 w-5 h-5 accent-blue-600">
      显示非必填字段
    </label>
  </div>

  <!-- 个人信息 -->
  <div id="personPage" class="page active">
    <div class="card">
      <div class="section-title">基本信息</div>
      <div class="form-group"><label class="form-label required">姓名</label><input class="form-input"></div>
      <div class="form-group"><label class="form-label required">住址</label><input class="form-input"></div>
      <div class="form-group"><label class="form-label required">手机电话</label><input class="form-input" type="tel"></div>
      <div class="form-group"><label class="form-label required">宗教</label>
        <select class="form-select"><option>伊斯兰教</option><option>基督教</option></select>
      </div>
      <div class="form-group"><label class="form-label required">性别</label>
        <select class="form-select"><option>男</option><option>女</option></select>
      </div>
    </div>

    <div class="card">
      <div class="section-title">证件照片</div>
      <div class="form-group"><label class="form-label required">身份证照片</label><div class="upload-box">点击上传</div></div>
    </div>

    <div class="card">
      <div class="section-title">劳务信息</div>
      <div class="form-group"><label class="form-label">所属公司</label><input class="form-input" value="CCECC" readonly></div>
      <div class="form-group"><label class="form-label">所属班组</label>
        <select class="form-select"><option>ADMIN</option><option>钢筋班组</option><option>模板班组</option></select>
      </div>
      <div class="form-group"><label class="form-label">从事工种</label>
        <select class="form-select"><option>土建</option><option>钢筋工</option><option>木工</option></select>
      </div>
    </div>
  </div>

  <!-- 工资信息 -->
  <div id="salaryPage" class="page">
    <div class="card">
      <div class="section-title">工资补助</div>
      <div class="form-group optional"><label class="form-label">基本工资(NGN)</label><input class="form-input" type="number"></div>
      <div class="form-group optional"><label class="form-label">房屋补助(NGN)</label><input class="form-input" type="number"></div>
      <div class="form-group optional"><label class="form-label">交通补助(NGN)</label><input class="form-input" type="number"></div>
    </div>

    <div class="card">
      <div class="section-title">银行信息</div>
      <div class="form-group optional"><label class="form-label">开户银行</label>
        <select class="form-select"><option>FIRST BANK</option><option>ZENITH BANK</option></select>
      </div>
      <div class="form-group optional"><label class="form-label">银行卡号</label><input class="form-input"></div>
    </div>

    <div class="card">
      <div class="section-title">备注</div>
      <div class="form-group optional"><label class="form-label">备注</label><textarea class="text-area"></textarea></div>
    </div>
  </div>

  <div class="bottom-bar">
    <button class="btn btn-primary" id="submitBtn">提交审核</button>
  </div>
</div>

<script>
// 页面切换
document.getElementById('addWorkerBtn').onclick = () => {
  document.getElementById('overviewPage').classList.remove('active');
  document.getElementById('entryPage').classList.add('active');
};

document.getElementById('backBtn').onclick = () => {
  document.getElementById('entryPage').classList.remove('active');
  document.getElementById('overviewPage').classList.add('active');
};

// TAB 切换
document.querySelectorAll('.tab').forEach(tab=>{
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('#entryPage .page').forEach(p=>p.classList.remove('active'));
    document.getElementById(tab.dataset.page + 'Page').classList.add('active');
  };
});

// 必填切换
document.getElementById('toggle').onchange = function(){
  document.body.classList.toggle('show-all', this.checked);
};

// 提交
document.getElementById('submitBtn').onclick = () => {
  alert('提交成功，等待审核！');
  document.getElementById('backBtn').click();
};
</script>
</body>
</html>
