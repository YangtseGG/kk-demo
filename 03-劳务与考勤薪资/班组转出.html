<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>班组转出系统专业版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        #targetModal { display: none; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); }
        #targetModal.show { display: flex; }
        .member-card.selected { border-color: #3b82f6; background-color: #eff6ff; }
        .member-card.selected .check-mark { background-color: #3b82f6; border-color: #3b82f6; }
        /* 隐藏滚动条 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden text-gray-800">

    <!-- 1. 头部：搜索与全选 -->
    <header class="bg-white px-4 pt-4 pb-2 shadow-sm z-30">
        <div class="flex justify-between items-center mb-3">
            <div>
                <h1 class="text-xl font-bold text-gray-900">人员转出</h1>
                <p class="text-xs text-blue-600 font-medium">源班组: ADMIN</p>
            </div>
            <button onclick="toggleSelectAll()" id="allBtn" class="bg-blue-50 text-blue-600 px-3 py-1 rounded-lg text-sm font-bold">全选</button>
        </div>
        <div class="relative">
            <input type="text" id="pSearch" oninput="filterList('pSearch', 'member-card')" placeholder="搜索 50+ 名成员..." 
                class="w-full pl-10 pr-4 py-2.5 bg-gray-100 border-none rounded-xl focus:ring-2 focus:ring-blue-500 transition-all text-sm">
            <span class="absolute left-3 top-3 text-gray-400">🔍</span>
        </div>
    </header>

    <!-- 2. 人员列表：模拟几十条数据 -->
    <main class="flex-1 overflow-y-auto p-4 space-y-2 no-scrollbar" id="memberContainer">
        <!-- JS 会在此处生成 50 条数据 -->
    </main>

    <!-- 3. 底部结算栏 -->
    <footer class="bg-white border-t p-4 safe-bottom flex items-center justify-between shadow-[0_-10px_30px_rgba(0,0,0,0.08)] z-30">
        <div>
            <span class="text-gray-400 text-xs block">已选择人数</span>
            <span class="text-2xl font-black text-blue-600" id="totalNum">0</span>
        </div>
        <button id="nextBtn" onclick="openTargetModal()" disabled class="bg-gray-200 text-gray-400 px-12 py-4 rounded-2xl font-bold text-lg transition-all active:scale-95">
            下一步
        </button>
    </footer>

    <!-- 4. 居中弹窗：解决多班组方案 -->
    <div id="targetModal" class="fixed inset-0 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-sm flex flex-col shadow-2xl overflow-hidden animate-in zoom-in duration-200">
            <!-- 弹窗头 -->
            <div class="p-6 pb-0">
                <h2 class="text-xl font-black text-center mb-4">选择目标班组</h2>
                <div class="relative mb-4">
                    <input type="text" id="gSearch" oninput="filterList('gSearch', 'group-item')" placeholder="班组太多？搜一下..." 
                        class="w-full pl-10 py-2 bg-gray-50 border border-gray-100 rounded-xl text-sm focus:outline-none focus:border-blue-500">
                    <span class="absolute left-3 top-2.5 text-xs text-gray-400">🔍</span>
                </div>
            </div>

            <!-- 班组列表（固定高度滚动） -->
            <div class="flex-1 overflow-y-auto max-h-[40vh] px-6 py-2 space-y-2 no-scrollbar" id="groupContainer">
                <!-- JS 会在此处生成 20+ 班组 -->
            </div>

            <!-- 弹窗脚 -->
            <div class="p-6 pt-2 space-y-3">
                <button onclick="doSubmit()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-100 active:scale-95 transition-all">确认转移</button>
                <button onclick="closeTargetModal()" class="w-full text-gray-400 text-sm font-medium py-2">再想想</button>
            </div>
        </div>
    </div>

    <!-- Toast提示 -->
    <div id="toast" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-gray-900/90 text-white px-8 py-4 rounded-2xl hidden z-[100] text-center shadow-xl backdrop-blur-md"></div>

    <script>
        // 1. 模拟生成 50 名人员数据
        const names = ["Abdurrahaman", "Abele", "Mohammed", "Omolewa", "Yusuf", "Sani", "Ebuka", "Chidi", "Tunde", "Fatima"];
        const roles = ["Carpenter", "Plumber", "Electrician", "PM", "Foreman"];
        const colors = ["bg-blue-500", "bg-green-500", "bg-purple-500", "bg-orange-500", "bg-pink-500"];
        
        const mContainer = document.getElementById('memberContainer');
        for(let i=1; i<=50; i++) {
            const name = names[i % names.length] + " " + names[(i+3) % names.length] + " " + i;
            const role = roles[i % roles.length];
            const color = colors[i % colors.length];
            const initials = name.split(' ').map(n => n[0]).join('').substring(0,2).toUpperCase();
            
            mContainer.innerHTML += `
                <div class="member-card bg-white p-4 rounded-2xl border-2 border-transparent flex items-center shadow-sm cursor-pointer transition-all active:scale-[0.98]" data-search="${name} ${role}">
                    <div class="w-11 h-11 ${color} text-white rounded-full flex items-center justify-center font-bold text-sm mr-4 shadow-inner">${initials}</div>
                    <div class="flex-1 overflow-hidden">
                        <h3 class="font-bold text-gray-800 truncate text-sm">${name}</h3>
                        <p class="text-[10px] text-gray-400 uppercase tracking-widest">${role}</p>
                    </div>
                    <div class="check-mark w-5 h-5 border-2 border-gray-200 rounded-full flex items-center justify-center transition-all">
                        <svg class="w-3 h-3 text-white fill-current" viewBox="0 0 20 20"><path d="M0 11l2-2 5 5L18 3l2 2L7 18z"/></svg>
                    </div>
                </div>
            `;
        }

        // 2. 模拟生成 20 个班组数据
        const groups = ["Air Conditioning", "General Works", "Scaffolding", "Painting", "Masonry", "Security", "IT Infra", "Cleaning", "Logistic", "Admin Support"];
        const gContainer = document.getElementById('groupContainer');
        for(let i=1; i<=25; i++) {
            const gName = groups[i % groups.length] + " Team " + i;
            gContainer.innerHTML += `
                <label class="group-item flex items-center p-4 border border-gray-100 rounded-xl hover:bg-blue-50 cursor-pointer transition-all has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50" data-search="${gName}">
                    <input type="radio" name="tg" value="${gName}" class="w-4 h-4 text-blue-600 focus:ring-0">
                    <span class="ml-3 text-sm font-bold text-gray-700">${gName}</span>
                </label>
            `;
        }

        // --- 交互逻辑 ---

        // 列表选择监听
        mContainer.addEventListener('click', (e) => {
            const card = e.target.closest('.member-card');
            if(!card) return;
            card.classList.toggle('selected');
            updateUI();
        });

        // 统一过滤函数
        function filterList(inputId, itemClass) {
            const q = document.getElementById(inputId).value.toLowerCase();
            document.querySelectorAll('.' + itemClass).forEach(item => {
                const text = item.getAttribute('data-search').toLowerCase();
                item.style.display = text.includes(q) ? 'flex' : 'none';
            });
        }

        function updateUI() {
            const count = document.querySelectorAll('.member-card.selected').length;
            document.getElementById('totalNum').innerText = count;
            const btn = document.getElementById('nextBtn');
            if(count > 0) {
                btn.disabled = false;
                btn.className = "bg-blue-600 text-white px-12 py-4 rounded-2xl font-bold text-lg shadow-lg shadow-blue-200 transition-all active:scale-95";
            } else {
                btn.disabled = true;
                btn.className = "bg-gray-200 text-gray-400 px-12 py-4 rounded-2xl font-bold text-lg transition-all";
            }
        }

        function toggleSelectAll() {
            const btn = document.getElementById('allBtn');
            const cards = Array.from(document.querySelectorAll('.member-card')).filter(c => c.style.display !== 'none');
            const isAll = btn.innerText === '取消';
            
            cards.forEach(c => isAll ? c.classList.remove('selected') : c.classList.add('selected'));
            btn.innerText = isAll ? '全选' : '取消';
            updateUI();
        }

        function openTargetModal() { document.getElementById('targetModal').classList.add('show'); }
        function closeTargetModal() { document.getElementById('targetModal').classList.remove('show'); }

        function doSubmit() {
            const target = document.querySelector('input[name="tg"]:checked');
            if(!target) { showToast("⚠️ 请选个目标班组"); return; }
            
            closeTargetModal();
            showToast(`✅ 转移成功！<br><small>已将人员移至 ${target.value}</small>`);
            setTimeout(() => location.reload(), 2000);
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerHTML = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 2500);
        }
    </script>
</body>
</html>
