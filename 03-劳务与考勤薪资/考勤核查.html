<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工地考勤抽查系统</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei", sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 0;
            margin-bottom: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        header h1 {
            text-align: center;
            font-size: 24px;
        }
        
        .filter-section {
            background-color: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 15px;
        }
        
        .filter-item {
            display: flex;
            align-items: center;
        }
        
        .filter-item label {
            margin-right: 10px;
            font-weight: bold;
            min-width: 60px;
        }
        
        .month-selector {
            display: flex;
            gap: 5px;
        }
        
        .month-btn {
            padding: 5px 10px;
            border: 1px solid #ddd;
            background-color: #f9f9f9;
            cursor: pointer;
            border-radius: 3px;
        }
        
        .month-btn.active {
            background-color: #3498db;
            color: white;
            border-color: #3498db;
        }
        
        .date-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        
        .date-btn {
            padding: 5px 10px;
            border: 1px solid #ddd;
            background-color: #f9f9f9;
            cursor: pointer;
            border-radius: 3px;
        }
        
        .date-btn.active {
            background-color: #2ecc71;
            color: white;
            border-color: #2ecc71;
        }
        
        .groups-section {
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            overflow: hidden;
        }
        
        .section-title {
            background-color: #34495e;
            color: white;
            padding: 10px 15px;
            font-size: 18px;
        }
        
        .groups-list {
            padding: 15px;
        }
        
        .group-item {
            border: 1px solid #eee;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .group-item:hover {
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }
        
        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .group-name {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .group-stats {
            display: flex;
            gap: 15px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }
        
        .stat-label {
            font-size: 12px;
            color: #7f8c8d;
        }
        
        .group-details {
            display: none;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #eee;
        }
        
        .worker-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        
        .worker-item {
            padding: 8px;
            border: 1px solid #eee;
            border-radius: 3px;
            background-color: #f9f9f9;
            position: relative;
        }
        
        .worker-item.correct {
            background-color: #d4edda;
            border-color: #c3e6cb;
        }
        
        .worker-item.absent {
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }
        
        .worker-status {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 12px;
            padding: 2px 5px;
            border-radius: 3px;
        }
        
        .status-correct {
            background-color: #28a745;
            color: white;
        }
        
        .status-absent {
            background-color: #dc3545;
            color: white;
        }
        
        .check-details {
            margin-top: 15px;
            border-top: 1px dashed #eee;
            padding-top: 15px;
        }
        
        .details-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .details-title {
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .toggle-details {
            background: none;
            border: none;
            color: #3498db;
            cursor: pointer;
            font-size: 14px;
        }
        
        .details-content {
            display: none;
            margin-top: 10px;
        }
        
        .detail-category {
            margin-bottom: 15px;
        }
        
        .category-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            padding: 5px;
            border-radius: 3px;
        }
        
        .category-correct {
            background-color: #d4edda;
            color: #155724;
        }
        
        .category-absent {
            background-color: #f8d7da;
            color: #721c24;
        }
        
        .check-btn {
            padding: 8px 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        
        .check-btn:hover {
            background-color: #2980b9;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background-color: white;
            width: 90%;
            max-width: 1000px;
            max-height: 90vh;
            border-radius: 5px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .modal-header {
            background-color: #34495e;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-title {
            font-size: 20px;
        }
        
        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }
        
        .modal-body {
            padding: 15px;
            overflow-y: auto;
            flex-grow: 1;
        }
        
        .check-progress {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .progress-bar {
            flex-grow: 1;
            height: 10px;
            background-color: #ecf0f1;
            border-radius: 5px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background-color: #2ecc71;
            width: 0%;
            transition: width 0.3s;
        }
        
        .worker-check {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .worker-info {
            flex: 1;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 5px;
        }
        
        .worker-name {
            font-size: 20px;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        
        .photo-section {
            flex: 2;
        }
        
        .photo-tabs {
            display: flex;
            border-bottom: 1px solid #eee;
            margin-bottom: 15px;
        }
        
        .photo-tab {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }
        
        .photo-tab.active {
            border-bottom-color: #3498db;
            color: #3498db;
        }
        
        .photos-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .photo-item {
            border: 1px solid #eee;
            border-radius: 5px;
            overflow: hidden;
        }
        
        .photo-img {
            width: 100%;
            height: 150px;
            background-color: #ecf0f1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7f8c8d;
        }
        
        .photo-info {
            padding: 10px;
            font-size: 12px;
            color: #7f8c8d;
        }
        
        .check-controls {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        
        .control-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .btn-prev {
            background-color: #95a5a6;
            color: white;
        }
        
        .btn-next {
            background-color: #3498db;
            color: white;
        }
        
        .btn-complete {
            background-color: #2ecc71;
            color: white;
        }
        
        .result-section {
            display: none;
            padding: 20px;
            text-align: center;
        }
        
        .result-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        
        .result-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .result-stat {
            text-align: center;
        }
        
        .result-value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .result-label {
            font-size: 14px;
            color: #7f8c8d;
        }
        
        .result-details {
            text-align: left;
            max-width: 600px;
            margin: 0 auto 30px;
        }
        
        .detail-item {
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 3px;
        }
        
        .back-btn {
            padding: 10px 30px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>工地考勤抽查系统</h1>

        <section class="filter-section">
            <div class="filter-row">

        </section>
    </div>
    
    <!-- 核查模态框 -->
    <div class="modal" id="checkModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">班组考勤核查</div>
                <button class="close-btn" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="check-progress">
                    <span>核查进度：</span>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <span id="progressText">0/0</span>
                </div>
                
                <div class="worker-check" id="workerCheck">
                    <div class="worker-info">
                        <div class="worker-name" id="workerName">工人姓名</div>
                        <div>工号：<span id="workerId">-</span></div>
                        <div>班组：<span id="workerGroup">-</span></div>
                        <div>岗位：<span id="workerPosition">-</span></div>
                        <div>考勤状态：<span id="attendanceStatus">-</span></div>
                    </div>
                    
                    <div class="photo-section">
                        <div class="photo-tabs">
                            <div class="photo-tab active" data-type="morning">上班照片</div>
                            <div class="photo-tab" data-type="evening">下班照片</div>
                        </div>
                        
                        <div class="photos-container" id="photosContainer">
                            <!-- 照片将通过JavaScript动态生成 -->
                        </div>
                    </div>
                </div>
                
                <div class="check-controls">
                    <button class="control-btn btn-prev" id="prevWorker">上一位</button>
                    <div>
                        <button class="control-btn" id="markPresent" style="background-color: #2ecc71; color: white;">标记为出勤</button>
                        <button class="control-btn" id="markAbsent" style="background-color: #e74c3c; color: white; margin-left: 10px;">标记为缺勤</button>
                    </div>
                    <button class="control-btn btn-next" id="nextWorker">下一位</button>
                </div>
                
                <div class="result-section" id="resultSection">
                    <div class="result-title">核查完成</div>
                    <div class="result-stats">
                        <div class="result-stat">
                            <div class="result-value" id="totalWorkers">0</div>
                            <div class="result-label">总人数</div>
                        </div>
                        <div class="result-stat">
                            <div class="result-value" id="presentCount">0</div>
                            <div class="result-label">实际出勤</div>
                        </div>
                        <div class="result-stat">
                            <div class="result-value" id="absentCount">0</div>
                            <div class="result-label">缺勤人数</div>
                        </div>
                        <div class="result-stat">
                            <div class="result-value" id="accuracy">0%</div>
                            <div class="result-label">考勤准确率</div>
                        </div>
                    </div>
                    
                    <div class="result-details" id="resultDetails">
                        <!-- 核查详情将通过JavaScript动态生成 -->
                    </div>
                    
                    <button class="back-btn" id="backToList">返回列表</button>
                </div>
            </div>
        </div>
    </div>

        // 当前选中的班组和工人索引
        let currentGroup = null;

        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            renderGroupsList();
            setupEventListeners();
        });

        // 渲染班组列表
        function renderGroupsList() {
            const groupsList = document.getElementById('groupsList');
            groupsList.innerHTML = '';
            
            groupsData.forEach(group => {
                // 计算核查结果
                const correctWorkers = group.workers.filter(w => w.checked && w.attended === w.present);
                const absentWorkers = group.workers.filter(w => w.checked && w.attended !== w.present);
                const checkedCount = group.workers.filter(w => w.checked).length;
                
                const groupElement = document.createElement('div');
                groupElement.className = 'group-item';
                groupElement.innerHTML = `
                    <div class="group-header">
                        <div class="group-name">${group.name}</div>
                        <div class="group-stats">
                            <div class="stat-item">
                                <div class="stat-value">${group.total}</div>
                                <div class="stat-label">总人数</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value">${group.attendance}</div>
                                <div class="stat-label">出勤人数</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value">${group.total - group.attendance}</div>
                                <div class="stat-label">缺勤人数</div>
                            </div>
                            ${checkedCount > 0 ? `
                                <div class="stat-item">
                                    <div class="stat-value">${correctWorkers.length}</div>
                                    <div class="stat-label">核查无误</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-value">${absentWorkers.length}</div>
                                    <div class="stat-label">核查缺勤</div>
                                </div>
                            ` : ''}
                        </div>
                        <button class="check-btn" data-group-id="${group.id}">${checkedCount > 0 ? '重新核查' : '核查考勤'}</button>
                    </div>
                    <div class="group-details">
                        <div>出勤人员名单：</div>
                        <div class="worker-list">
                            ${group.workers.filter(w => w.attended).map(worker => {
                                let statusClass = '';
                                let statusText = '';
                                
                                if (worker.checked) {
                                    if (worker.attended === worker.present) {
                                        statusClass = 'correct';
                                        statusText = '<span class="worker-status status-correct">核查无误</span>';
                                    } else {
                                        statusClass = 'absent';
                                        statusText = '<span class="worker-status status-absent">核查缺勤</span>';
                                    }
                                }
                                
                                return `<div class="worker-item ${statusClass}">${worker.name} (${worker.id}) ${statusText}</div>`;
                            }).join('')}
                        </div>
                        
                        ${checkedCount > 0 ? `
                            <div class="check-details">
                                <div class="details-header">
                                    <div class="details-title">核查结果明细</div>
                                    <button class="toggle-details">展开详情</button>
                                </div>
                                <div class="details-content">
                                    <div class="detail-category">
                                        <div class="category-title category-correct">核查无误人员 (${correctWorkers.length}人)</div>
                                        <div class="worker-list">
                                            ${correctWorkers.map(worker => 
                                                `<div class="worker-item correct">
                                                    ${worker.name} (${worker.id}) - ${worker.position}
                                                    <span class="worker-status status-correct">核查无误</span>
                                                </div>`
                                            ).join('')}
                                        </div>
                                    </div>
                                    <div class="detail-category">
                                        <div class="category-title category-absent">核查缺勤人员 (${absentWorkers.length}人)</div>
                                        <div class="worker-list">
                                            ${absentWorkers.map(worker => 
                                                `<div class="worker-item absent">
                                                    ${worker.name} (${worker.id}) - ${worker.position}
                                                    <span class="worker-status status-absent">${worker.attended ? '系统记录出勤' : '系统记录缺勤'}</span>
                                                </div>`
                                            ).join('')}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
                groupsList.appendChild(groupElement);
            });
            
            // 添加展开/收起详情的事件监听
            document.querySelectorAll('.toggle-details').forEach(btn => {
                btn.addEventListener('click', function() {
                    const detailsContent = this.closest('.check-details').querySelector('.details-content');
                    const isVisible = detailsContent.style.display === 'block';
                    
                    detailsContent.style.display = isVisible ? 'none' : 'block';
                    this.textContent = isVisible ? '展开详情' : '收起详情';
                });
            });
        }

        // 设置事件监听器
        function setupEventListeners() {
            // 月份选择
            document.querySelectorAll('.month-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    // 在实际应用中，这里应该根据选择的月份过滤数据
                });
            });
            
            // 日期选择
            document.querySelectorAll('.date-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    // 在实际应用中，这里应该根据选择的日期过滤数据
                });
            });
            
            // 班组详情展开/收起
            document.addEventListener('click', function(e) {
                if (e.target.closest('.group-header')) {
                    const groupItem = e.target.closest('.group-item');
                    const details = groupItem.querySelector('.group-details');
                    details.style.display = details.style.display === 'block' ? 'none' : 'block';
                }
                
                // 核查按钮
                if (e.target.classList.contains('check-btn')) {
                    const groupId = parseInt(e.target.getAttribute('data-group-id'));
                    startGroupCheck(groupId);
                }
            });
            
            // 关闭模态框
            document.getElementById('closeModal').addEventListener('click', closeModal);
            
            // 上下工人导航
            document.getElementById('prevWorker').addEventListener('click', goToPrevWorker);
            document.getElementById('nextWorker').addEventListener('click', goToNextWorker);
            
            // 标记出勤/缺勤
            document.getElementById('markPresent').addEventListener('click', function() {
                markWorkerPresent(true);
            });
            
            document.getElementById('markAbsent').addEventListener('click', function() {
                markWorkerPresent(false);
            });
            
            // 照片标签切换
            document.querySelectorAll('.photo-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.photo-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentPhotoType = this.getAttribute('data-type');
                    renderPhotos();
                });
            });
            
            // 返回列表按钮
            document.getElementById('backToList').addEventListener('click', function() {
                closeModal();
                renderGroupsList(); // 刷新列表以显示最新的核查结果
            });
        }

        // 开始班组核查
        function startGroupCheck(groupId) {
            currentGroup = groupsData.find(g => g.id === groupId);
            currentWorkerIndex = 0;
            currentPhotoType = "morning";
            
            // 更新模态框标题
            document.getElementById('modalTitle').textContent = `${currentGroup.name} - 考勤核查`;
            
            // 显示核查界面，隐藏结果界面
            document.getElementById('workerCheck').style.display = 'flex';
            document.getElementById('resultSection').style.display = 'none';
            
            // 渲染第一个工人
            renderCurrentWorker();
            renderPhotos();
            
            // 打开模态框
            document.getElementById('checkModal').style.display = 'flex';
        }

        // 渲染当前工人信息
        function renderCurrentWorker() {
            const worker = currentGroup.workers[currentWorkerIndex];
            document.getElementById('workerName').textContent = worker.name;
            document.getElementById('workerId').textContent = worker.id;
            document.getElementById('workerGroup').textContent = currentGroup.name;
            document.getElementById('workerPosition').textContent = worker.position;
            document.getElementById('attendanceStatus').textContent = worker.attended ? '已打卡' : '未打卡';
            
            // 更新进度
            const checkedCount = currentGroup.workers.filter(w => w.checked).length;
            const totalCount = currentGroup.workers.length;
            const progress = (checkedCount / totalCount) * 100;
            
            document.getElementById('progressFill').style.width = `${progress}%`;
            document.getElementById('progressText').textContent = `${checkedCount}/${totalCount}`;
            
            // 更新按钮状态
            document.getElementById('prevWorker').disabled = currentWorkerIndex === 0;
            document.getElementById('nextWorker').disabled = currentWorkerIndex === currentGroup.workers.length - 1;
            
            if (currentWorkerIndex === currentGroup.workers.length - 1) {
                document.getElementById('nextWorker').textContent = '完成核查';
                document.getElementById('nextWorker').className = 'control-btn btn-complete';
            } else {
                document.getElementById('nextWorker').textContent = '下一位';
                document.getElementById('nextWorker').className = 'control-btn btn-next';
            }
        }

        // 渲染照片
        function renderPhotos() {
            const photosContainer = document.getElementById('photosContainer');
            const photos = currentPhotoType === 'morning' ? currentGroup.morningPhotos : currentGroup.eveningPhotos;
            
            photosContainer.innerHTML = photos.map(photo => `
                <div class="photo-item">
                    <div class="photo-img">集体照片<br>${photo.time} ${photo.location}</div>
                    <div class="photo-info">${photo.time} 拍摄于 ${photo.location}</div>
                </div>
            `).join('');
        }

        // 标记工人出勤状态
        function markWorkerPresent(present) {
            currentGroup.workers[currentWorkerIndex].present = present;
            currentGroup.workers[currentWorkerIndex].checked = true;
            
            // 自动转到下一个工人
            if (currentWorkerIndex < currentGroup.workers.length - 1) {
                currentWorkerIndex++;
                renderCurrentWorker();
                renderPhotos();
            } else {
                // 如果是最后一个工人，显示结果
                showCheckResult();
            }
        }

        // 显示上一个工人
        function goToPrevWorker() {
            if (currentWorkerIndex > 0) {
                currentWorkerIndex--;
                renderCurrentWorker();
                renderPhotos();
            }
        }

        // 显示下一个工人
        function goToNextWorker() {
            if (currentWorkerIndex < currentGroup.workers.length - 1) {
                currentWorkerIndex++;
                renderCurrentWorker();
                renderPhotos();
            } else {
                // 如果是最后一个工人，显示结果
                showCheckResult();
            }
        }

        // 显示核查结果
        function showCheckResult() {
            // 隐藏核查界面，显示结果界面
            document.getElementById('workerCheck').style.display = 'none';
            document.getElementById('resultSection').style.display = 'block';
            
            const totalWorkers = currentGroup.workers.length;
            const presentCount = currentGroup.workers.filter(w => w.present).length;
            const absentCount = totalWorkers - presentCount;
            
            // 计算考勤准确率（系统记录出勤与实际核查一致的比例）
            const accurateCount = currentGroup.workers.filter(w => w.attended === w.present).length;
            const accuracy = ((accurateCount / totalWorkers) * 100).toFixed(1);
            
            document.getElementById('totalWorkers').textContent = totalWorkers;
            document.getElementById('presentCount').textContent = presentCount;
            document.getElementById('absentCount').textContent = absentCount;
            document.getElementById('accuracy').textContent = `${accuracy}%`;
            
            // 生成核查详情
            const resultDetails = document.getElementById('resultDetails');
            resultDetails.innerHTML = '';
            
            // 不一致记录
            const discrepancies = currentGroup.workers.filter(w => w.attended !== w.present);
            
            if (discrepancies.length === 0) {
                resultDetails.innerHTML = '<div class="detail-item">考勤记录与实际核查结果完全一致。</div>';
            } else {
                resultDetails.innerHTML = '<div class="detail-item" style="background-color: #ffeaa7; border-left: 4px solid #fdcb6e;">发现以下不一致记录：</div>';
                
                discrepancies.forEach(worker => {
                    const detailItem = document.createElement('div');
                    detailItem.className = 'detail-item';
                    detailItem.style.backgroundColor = worker.attended ? '#ffcccc' : '#ccffcc';
                    detailItem.style.borderLeft = `4px solid ${worker.attended ? '#ff6b6b' : '#51cf66'}`;
                    
                    detailItem.innerHTML = `
                        <strong>${worker.name} (${worker.id})</strong><br>
                        系统记录: ${worker.attended ? '出勤' : '缺勤'} | 核查结果: ${worker.present ? '出勤' : '缺勤'}
                    `;
                    
                    resultDetails.appendChild(detailItem);
                });
            }
        }

        // 关闭模态框
        function closeModal() {
            document.getElementById('checkModal').style.display = 'none';
            // 在实际应用中，这里应该保存核查结果
        }
    </script>
</body>
</html>
