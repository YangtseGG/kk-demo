          <textarea id="u3202_input" class="u3202_input">1.业务处理，这里要考虑无网络的情况，没有网络，不能影响拍照；

3. 如果本地SDK识别，识别成功后，保存在本地，有网络后上传，并回弹消息考勤同步结果；

4. 拍照时要记录gps信息；
