<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>新增建筑工人</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto; background:#f5f7fa; padding-bottom:100px; }
.tab-bar { display:flex; background:#fff; border-bottom:1px solid #eee; position:sticky; top:0; z-index:10; }
.tab { flex:1; text-align:center; padding:14px 0; font-size:15px; color:#555; }
.tab.active { color:#1a56db; border-bottom:2px solid #1a56db; font-weight:600; }

.card { background:#fff; margin:12px; border-radius:12px; padding:10px 0; }
.section-title { font-size:15px; font-weight:600; color:#1a56db; padding:12px 15px 8px; }
.form-group { padding:12px 15px; }
.form-label { font-size:13px; color:#374151; margin-bottom:4px; display:flex; align-items:center; }
.required::before { content:'*'; color:#e53e3e; margin-right:4px; }
.form-input, .form-select, .text-area {
  width:100%; padding:10px; border:1px solid #d1d5db; border-radius:8px; font-size:14px; background:#fff;
}
.text-area { min-height:70px; resize:none; }
.upload-box { border:1px dashed #ccc; border-radius:8px; padding:20px; text-align:center; color:#777; font-size:13px; }

.toggle-bar { display:flex; justify:flex-end; padding:10px 15px; background:#fff; position:sticky; top:48px; z-index:9; }
.bottom-bar {
  position:fixed; bottom:0; left:0; right:0; display:flex; gap:12px; padding:12px 15px; background:#fff;
  box-shadow:0 -2px 10px rgba(0,0,0,.08);
}
.btn { flex:1; padding:12px; border-radius:10px; font-size:15px; border:none; }
.btn-primary { background:#1a56db; color:#fff; }

/* 非必填控制 */
.optional { display:none; }
body.show-all .optional { display:block; }

/* 页面切换 */
.page { display:none; }
.page.active { display:block; }
</style>
</head>

<body class="show-all">

<!-- TAB 切换 -->
<div class="tab-bar">
  <div class="tab active" data-page="person">个人信息</div>
  <div class="tab" data-page="salary">工资信息</div>
</div>

<!-- 切换开关 -->
<div class="toggle-bar">
  <label class="text-sm flex items-center">
    <input type="checkbox" id="toggle" checked class="mr-2 w-5 h-5 accent-blue-600">
    显示非必填字段
  </label>
</div>

<!-- ================= 个人信息 ================= -->
<div class="page active" id="personPage">
  
  <!-- 基本信息 -->
  <div class="card">
    <div class="section-title">基本信息</div>
    <div class="form-group"><label class="form-label required">姓名</label><input class="form-input"></div>
    <div class="form-group optional"><label class="form-label">人员昵称</label><input class="form-input"></div>
    <div class="form-group"><label class="form-label required">住址</label><input class="form-input"></div>
    <div class="form-group"><label class="form-label required">员工编号</label><input class="form-input"></div>
    <div class="form-group"><label class="form-label required">手机电话</label><input class="form-input" type="tel"></div>
    <div class="form-group"><label class="form-label">出生日期</label><input class="form-input" type="date"></div>
    <div class="form-group"><label class="form-label required">宗教</label>
      <select class="form-select"><option>伊斯兰教</option><option>基督教</option><option>佛教</option><option>其他</option></select>
    </div>
    <div class="form-group"><label class="form-label required">性别</label>
      <select class="form-select"><option>男</option><option>女</option></select>
    </div>
    <div class="form-group optional"><label class="form-label">民族</label>
      <select class="form-select"><option>豪萨-富拉尼族</option><option>约鲁巴族</option><option>伊博族</option><option>其他</option></select>
    </div>
  </div>

  <!-- 证件照片 -->
  <div class="card">
    <div class="section-title">证件照片</div>
    <div class="form-group"><label class="form-label required">身份证照片</label><div class="upload-box">点击上传</div></div>
    <div class="form-group optional"><label class="form-label">工作证照片</label><div class="upload-box">点击上传</div></div>
    <div class="form-group optional"><label class="form-label">其它附件</label><div class="upload-box">点击添加</div></div>
  </div>

  <!-- 成员关系 -->
  <div class="card">
    <div class="section-title">成员关系</div>
    <div class="form-group optional"><label class="form-label">紧急联系人姓名</label><input class="form-input"></div>
    <div class="form-group optional"><label class="form-label">成员关系</label><input class="form-input"></div>
    <div class="form-group optional"><label class="form-label">紧急联系人电话</label><input class="form-input"></div>
    <div class="form-group optional"><label class="form-label">联系地址</label><input class="form-input"></div>
  </div>

  <!-- 劳务信息 -->
  <div class="card">
    <div class="section-title">劳务信息</div>
    <div class="form-group"><label class="form-label">所属公司</label><input class="form-input" value="CCECC" readonly></div>
    <div class="form-group"><label class="form-label">所属班组</label>
      <select class="form-select"><option>ADMIN</option><option>钢筋班组</option><option>模板班组</option><option>混凝土班组</option></select>
    </div>
    <div class="form-group"><label class="form-label">从事工种</label>
      <select class="form-select"><option>土建 / BACHING PLANT</option><option>钢筋工</option><option>木工</option><option>水电工</option></select>
    </div>
    <div class="form-group"><label class="form-label">入职日期</label><input class="form-input" type="date"></div>
  </div>

</div>

<!-- ================= 工资信息 ================= -->
<div class="page" id="salaryPage">

  <!-- 工资补助 -->
  <div class="card">
    <div class="section-title">工资补助</div>
    <div class="form-group optional"><label class="form-label">基本工资(NGN)</label><input class="form-input" type="number"></div>
    <div class="form-group optional"><label class="form-label">房屋补助(NGN)</label><input class="form-input" type="number"></div>
    <div class="form-group optional"><label class="form-label">交通补助(NGN)</label><input class="form-input" type="number"></div>
    <div class="form-group optional"><label class="form-label">伙食补助(NGN)</label><input class="form-input" type="number"></div>
    <div class="form-group optional"><label class="form-label">医疗补助(NGN)</label><input class="form-input" type="number"></div>
    <div class="form-group optional"><label class="form-label">工具补助(NGN)</label><input class="form-input" type="number"></div>
    <div class="form-group optional"><label class="form-label">其它补助(NGN)</label><input class="form-input" type="number"></div>
    <div class="form-group optional"><label class="form-label">工作年限</label><input class="form-input" type="number"></div>
  </div>

  <!-- 银行信息 -->
  <div class="card">
    <div class="section-title">银行信息</div>
    <div class="form-group optional"><label class="form-label">开户银行</label>
      <select class="form-select"><option>FIRST BANK</option><option>ZENITH BANK</option><option>GTB</option><option>UBA</option></select>
    </div>
    <div class="form-group optional"><label class="form-label">SORTCOD</label><input class="form-input"></div>
    <div class="form-group optional"><label class="form-label">银行卡号</label><input class="form-input"></div>
    <div class="form-group optional"><label class="form-label">工会会费(NGN)</label><input class="form-input" type="number"></div>
  </div>

  <!-- 保险与税务 -->
  <div class="card">
    <div class="section-title">保险与税务</div>
    <div class="form-group optional"><label class="form-label">养老保险注册号</label><input class="form-input"></div>
    <div class="form-group optional"><label class="form-label">养老保险公司</label>
      <select class="form-select"><option>请选择养老保险公司</option><option>Company A</option><option>Company B</option></select>
    </div>
    <div class="form-group optional"><label class="form-label">纳税人识别号</label><input class="form-input"></div>
    <div class="form-group optional"><label class="form-label">工作经验</label><textarea class="text-area"></textarea></div>
  </div>

  <!-- 备注 -->
  <div class="card">
    <div class="section-title">备注</div>
    <div class="form-group optional"><label class="form-label">备注</label><textarea class="text-area"></textarea></div>
  </div>

</div>

<!-- 底部提交按钮 -->
<div class="bottom-bar">
  <button class="btn btn-primary" id="submitBtn">提交</button>
</div>

<script>
// TAB 切换
document.querySelectorAll('.tab').forEach(tab=>{
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById(tab.dataset.page + 'Page').classList.add('active');
  };
});

// 必填切换
document.getElementById('toggle').onchange = function(){
  document.body.classList.toggle('show-all', this.checked);
};

// 提交
document.getElementById('submitBtn').onclick = () => {
  alert('提交成功！');
};
</script>
</body>
</html>
