<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工地安全奖惩记录管理系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2c6fbb;
            --secondary: #e9f0f8;
            --danger: #dc3545;
            --warning: #ffc107;
            --success: #28a745;
            --light: #f8f9fa;
            --dark: #343a40;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f0f5ff;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background-color: var(--primary);
            color: white;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .header-logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .logo-icon {
            background: white;
            width: 50px;
            height: 50px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--primary);
        }
        
        .header-title h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .header-title p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .project-select {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.2);
            padding: 8px 15px;
            border-radius: 6px;
            gap: 10px;
        }
        
        .project-select select {
            background: transparent;
            color: white;
            border: none;
            padding: 5px;
            min-width: 200px;
            font-size: 16px;
        }
        
        .project-select option {
            color: var(--dark);
        }
        
        .actions {
            background: var(--secondary);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 1px solid #e0e7f3;
        }
        
        .btn {
            padding: 8px 16px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-success {
            background: var(--success);
            color: white;
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        
        .btn-warning {
            background: var(--warning);
            color: var(--dark);
        }
        
        .btn-light {
            background: white;
            border: 1px solid #ddd;
            color: var(--dark);
        }
        
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        
        .stat-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 20px 30px;
            background: white;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
            text-align: center;
            border-top: 4px solid var(--primary);
        }
        
        .stat-card.danger {
            border-color: var(--danger);
        }
        
        .stat-card.warning {
            border-color: var(--warning);
        }
        
        .stat-card.success {
            border-color: var(--success);
        }
        
        .stat-value {
            font-size: 30px;
            font-weight: 700;
            margin: 10px 0;
            color: var(--primary);
        }
        
        .stat-card.danger .stat-value {
            color: var(--danger);
        }
        
        .stat-card.warning .stat-value {
            color: var(--warning);
        }
        
        .stat-card.success .stat-value {
            color: var(--success);
        }
        
        .stat-label {
            font-size: 14px;
            color: #777;
            font-weight: 500;
        }
        
        .table-container {
            padding: 0 20px 20px;
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        th {
            background: var(--secondary);
            color: var(--primary);
            font-weight: 600;
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #d0d9e8;
        }
        
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }
        
        tr:hover {
            background: rgba(44, 111, 187, 0.03);
        }
        
        .type-reward {
            color: var(--success);
            font-weight: 600;
        }
        
        .type-penalty {
            color: var(--danger);
            font-weight: 600;
        }
        
        .tag {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .tag-success {
            background: rgba(40, 167, 69, 0.15);
            color: var(--success);
        }
        
        .tag-danger {
            background: rgba(220, 53, 69, 0.15);
            color: var(--danger);
        }
        
        .tag-warning {
            background: rgba(255, 193, 7, 0.15);
            color: var(--dark);
        }
        
        .export-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: white;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            padding: 30px;
            position: relative;
            box-shadow: 0 5px 25px rgba(0,0,0,0.2);
        }
        
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #777;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        
        .form-group select, 
        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
            font-size: 16px;
        }
        
        .export-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        
        .export-option {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .export-option:hover {
            background: var(--secondary);
            border-color: var(--primary);
        }
        
        .export-option.selected {
            background: var(--secondary);
            border: 2px solid var(--primary);
        }
        
        .export-option i {
            font-size: 28px;
            margin-bottom: 10px;
            color: var(--primary);
        }
        
        .action-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        
        .no-data {
            text-align: center;
            padding: 40px 20px;
            color: #777;
        }
        
        .result-details {
            max-height: 200px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 5px;
            font-family: monospace;
            background: #f9f9f9;
            margin-top: 20px;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--success);
            color: white;
            padding: 15px 25px;
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transform: translateX(150%);
            transition: transform 0.3s ease;
            z-index: 2000;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        .notification.danger {
            background: var(--danger);
        }
        
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .export-options {
                grid-template-columns: 1fr;
            }
            
            .actions {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部标题区域 -->
        <div class="header">
            <div class="header-logo">
                <div class="logo-icon">
                    <i class="fas fa-hard-hat"></i>
                </div>
                <div class="header-title">
                    <h1>安全奖惩/违章记录汇总表</h1>
                    <p>Safety Rewards & Violations Summary Sheet</p>
                </div>
            </div>
            <div class="table-number">
                <p>表6.2.3</p>
            </div>
            <div class="project-select">
                <i class="fas fa-building"></i>
                <select id="project-select">
                    <option value="">-- 选择工程 --</option>
                    <option value="project1">上海中心大厦项目</option>
                    <option value="project2">广州地铁14号线工程</option>
                    <option value="project3">深圳前海金融中心</option>
                    <option value="project4">北京大兴机场项目</option>
                </select>
            </div>
        </div>
        
        <!-- 操作按钮区域 -->
        <div class="actions">
            <button class="btn btn-primary" id="add-record">
                <i class="fas fa-plus"></i> 添加新记录
            </button>
            <button class="btn btn-success" id="export-all">
                <i class="fas fa-download"></i> 导出所有记录
            </button>
            <button class="btn btn-warning" id="export-rewards">
                <i class="fas fa-trophy"></i> 仅导出奖励
            </button>
            <button class="btn btn-danger" id="export-penalties">
                <i class="fas fa-exclamation-triangle"></i> 仅导出处罚
            </button>
            <button class="btn btn-light" id="stats-toggler">
                <i class="fas fa-chart-line"></i> 显示统计
            </button>
        </div>
        
        <!-- 统计信息卡片 -->
        <div class="stat-cards" id="stat-cards">
            <div class="stat-card">
                <div class="stat-label">总记录数</div>
                <div class="stat-value" id="total-count">24</div>
                <div class="stat-desc">所有奖惩记录</div>
            </div>
            <div class="stat-card success">
                <div class="stat-label">奖励记录</div>
                <div class="stat-value" id="rewards-count">8</div>
                <div class="stat-desc">安全行为表彰</div>
            </div>
            <div class="stat-card danger">
                <div class="stat-label">处罚记录</div>
                <div class="stat-value" id="penalties-count">16</div>
                <div class="stat-desc">违章行为处理</div>
            </div>
            <div class="stat-card warning">
                <div class="stat-label">涉及人员</div>
                <div class="stat-value" id="people-count">23</div>
                <div class="stat-desc">参与人员数量</div>
            </div>
        </div>
        
        <!-- 数据表格 -->
        <div class="table-container">
            <table id="records-table">
                <thead>
                    <tr>
                        <th>序号</th>
                        <th>时间</th>
                        <th>姓名/奖罚对象</th>
                        <th>工种</th>
                        <th>事由/违章事例</th>
                        <th>类型</th>
                        <th>结果/详情</th>
                        <th>备注</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- 数据通过JavaScript动态生成 -->
                </tbody>
            </table>
            <div class="no-data" id="no-data">
                <i class="fas fa-database" style="font-size: 48px; margin-bottom: 15px;"></i>
                <h3>暂无记录数据</h3>
                <p>请点击"添加新记录"按钮添加第一条记录</p>
            </div>
        </div>
    </div>
    
    <!-- 导出模态框 -->
    <div class="export-modal" id="export-modal">
        <div class="modal-content">
            <span class="close-btn" id="close-export-modal">&times;</span>
            <h2 style="margin-bottom: 20px;"><i class="fas fa-file-export"></i> 导出记录</h2>
            
            <div class="form-group">
                <label for="export-project">选择工程：</label>
                <select id="export-project">
                    <option value="current">当前工程</option>
                    <option value="all">所有工程</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="date-range">日期范围：</label>
                <select id="date-range">
                    <option value="all">所有日期</option>
                    <option value="last-week">最近一周</option>
                    <option value="last-month">最近一个月</option>
                    <option value="last-quarter">最近一个季度</option>
                    <option value="custom">自定义日期</option>
                </select>
            </div>
            
            <div class="export-options">
                <div class="export-option selected" data-type="all">
                    <i class="fas fa-list"></i>
                    <div>所有记录</div>
                </div>
                <div class="export-option" data-type="rewards">
                    <i class="fas fa-trophy"></i>
                    <div>仅奖励</div>
                </div>
                <div class="export-option" data-type="penalties">
                    <i class="fas fa-exclamation-triangle"></i>
                    <div>仅处罚</div>
                </div>
            </div>
            
            <div class="action-buttons">
                <button class="btn btn-light" id="cancel-export">取消</button>
                <button class="btn btn-primary" id="confirm-export">导出</button>
            </div>
        </div>
    </div>
    
    <!-- 通知区域 -->
    <div class="notification" id="notification">
        <span id="notification-text">导出成功！文件已下载</span>
    </div>

    <script>
        // 样本数据
        const sampleData = [
            { id: 1, date: '2024-07-05', name: '张三', occupation: '电工', details: '高空作业安全措施规范执行', type: '奖励', result: '通报表扬+现金500元', remark: '' },
            { id: 2, date: '2024-07-07', name: '李四', occupation: '焊工', details: '无证动火作业', type: '处罚', result: '警告+罚款300元+停工学习1天', remark: '二次违章处理' },
            { id: 3, date: '2024-07-10', name: '王五', occupation: '架子工', details: '发现并报告重大结构安全隐患', type: '奖励', result: '现金1000元+安全奖状', remark: '通报表扬' },
            { id: 4, date: '2024-07-12', name: '赵六', occupation: '混凝土工', details: '未佩戴安全帽进入施工现场', type: '处罚', result: '罚款100元+安全学习2小时', remark: '初犯警告' },
            { id: 5, date: '2024-07-13', name: '主体施工班', occupation: '-', details: '月度安全生产无事故', type: '奖励', result: '奖金5000元', remark: '集体表彰' },
            { id: 6, date: '2024-07-15', name: '孙七', occupation: '塔吊操作员', details: '违规操作起重设备', type: '处罚', result: '罚款500元+暂停操作资格', remark: '严重违章' },
        ];
        
        // DOM元素
        const tableBody = document.querySelector('#records-table tbody');
        const noData = document.getElementById('no-data');
        const exportModal = document.getElementById('export-modal');
        const totalCount = document.getElementById('total-count');
        const rewardsCount = document.getElementById('rewards-count');
        const penaltiesCount = document.getElementById('penalties-count');
        const peopleCount = document.getElementById('people-count');
        
        // 初始化表格
        function renderTable(data) {
            if(data.length === 0) {
                noData.style.display = 'block';
                tableBody.innerHTML = '';
                return;
            }
            
            noData.style.display = 'none';
            tableBody.innerHTML = '';
            
            data.forEach(item => {
                const tr = document.createElement('tr');
                
                const typeClass = item.type === '奖励' ? 'type-reward' : 'type-penalty';
                
                tr.innerHTML = `
                    <td>${item.id}</td>
                    <td>${item.date}</td>
                    <td>${item.name}</td>
                    <td>${item.occupation}</td>
                    <td>${item.details}</td>
                    <td class="${typeClass}">${item.type}</td>
                    <td>${item.result}</td>
                    <td>${item.remark}</td>
                `;
                
                tableBody.appendChild(tr);
            });
        }
        
        // 更新统计信息
        function updateStats() {
            const rewards = sampleData.filter(item => item.type === '奖励').length;
            const penalties = sampleData.filter(item => item.type === '处罚').length;
            const people = [...new Set(sampleData.map(item => item.name))].length;
            
            totalCount.textContent = sampleData.length;
            rewardsCount.textContent = rewards;
            penaltiesCount.textContent = penalties;
            peopleCount.textContent = people;
        }
        
        // 打开导出模态框
        function openExportModal(type) {
            const options = document.querySelectorAll('.export-option');
            options.forEach(option => {
                option.classList.remove('selected');
                if(option.dataset.type === type) {
                    option.classList.add('selected');
                }
            });
            exportModal.style.display = 'flex';
        }
        
        // 关闭导出模态框
        function closeExportModal() {
            exportModal.style.display = 'none';
        }
        
        // 显示通知
        function showNotification(message, isError = false) {
            const notification = document.getElementById('notification');
            const text = document.getElementById('notification-text');
            
            text.textContent = message;
            notification.classList.remove('danger');
            
            if(isError) {
                notification.classList.add('danger');
            }
            
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
        
        // 模拟导出功能
        function exportRecords(type) {
            // 在实际应用中，这里会实现导出CSV/Excel的功能
            showNotification(`"${type === 'all' ? '所有记录' : (type === 'rewards' ? '奖励记录' : '处罚记录')}" 已成功导出为CSV文件`);
        }
        
        // 绑定事件监听器
        document.getElementById('add-record').addEventListener('click', () => {
            showNotification('添加新记录功能已触发！此Demo为静态展示');
        });
        
        document.getElementById('export-all').addEventListener('click', () => {
            openExportModal('all');
        });
        
        document.getElementById('export-rewards').addEventListener('click', () => {
            openExportModal('rewards');
        });
        
        document.getElementById('export-penalties').addEventListener('click', () => {
            openExportModal('penalties');
        });
        
        document.getElementById('close-export-modal').addEventListener('click', closeExportModal);
        document.getElementById('cancel-export').addEventListener('click', closeExportModal);
        
        document.getElementById('confirm-export').addEventListener('click', () => {
            const selectedOption = document.querySelector('.export-option.selected');
            const exportType = selectedOption.dataset.type;
            exportRecords(exportType);
            closeExportModal();
        });
        
        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', () => {
            renderTable(sampleData);
            updateStats();
        });
    </script>
</body>
</html>
