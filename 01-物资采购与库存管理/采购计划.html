<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>采购计划审核</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #f7f8fa;
      color: #1d1d1f;
      line-height: 1.5;
    }

    .header {
      background: white;
      padding: 16px 16px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #1d1d1f;
    }

    .content {
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* 物料卡片 */
    .item-card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      position: relative;
    }

    /* 撤销状态：左侧色条 */
    .item-card.revoked::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: #ff3b30; /* 红色表示撤销 */
      border-radius: 0 4px 4px 0;
    }

    .item-header {
      padding: 16px;
      display: flex;
      align-items: flex-start;
      cursor: pointer;
      position: relative;
    }

    .item-header .name {
      flex: 1;
      font-size: 16px;
      font-weight: 500;
      color: #1d1d1f;
      /* 最多显示两行，超出省略 */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .revoked .item-header .name {
      color: #a0a0a0;
    }

    .status-tag {
      background: #ffeaea;
      color: #ff3b30;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: 10px;
      white-space: nowrap;
      align-self: flex-start;
    }

    .arrow {
      margin-left: 8px;
      font-size: 14px;
      color: #8e8e93;
      transition: transform 0.2s ease;
      align-self: center;
    }

    .item-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, padding 0.3s ease;
      background: #fafafa;
    }

    .item-body.active {
      max-height: 500px; /* 足够大以容纳内容 */
      padding: 0 16px 16px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .label {
      color: #8e8e93;
      font-size: 14px;
    }

    .value {
      color: #1d1d1f;
      font-size: 14px;
      text-align: right;
      max-width: 60%;
      word-break: break-word;
    }

    .revoked .value,
    .revoked .label {
      color: #c0c0c0 !important;
    }

    /* 禁用输入框样式 */
    .revoked input {
      background: #f5f5f5 !important;
      color: #c0c0c0 !important;
      pointer-events: none;
      border-color: #e0e0e0 !important;
    }

    input[type="number"] {
      width: 100px;
      padding: 6px 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      text-align: right;
    }

    .submit-btn {
      display: block;
      width: calc(100% - 32px);
      margin: 24px auto 32px;
      padding: 16px;
      background: #007aff;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .submit-btn:active {
      background: #0062cc;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>采购计划审核</h1>
  </div>

  <div class="content">

    <!-- 正常物料 -->
    <div class="item-card">
      <div class="item-header" onclick="toggleItem('item1')">
        <div class="name">安全帽（白色）高强度ABS材质，符合GB2811-2019标准</div>
        <div class="arrow">▼</div>
      </div>
      <div id="item1" class="item-body">
        <div class="detail-row">
          <span class="label">采购数量</span>
          <span class="value">400 套</span>
        </div>
        <div class="detail-row">
          <span class="label">审核数量</span>
          <input type="number" value="400" min="0" />
        </div>
        <div class="detail-row">
          <span class="label">物料编码</span>
          <span class="value">MAT-60100100002</span>
        </div>
        <div class="detail-row">
          <span class="label">提料人</span>
          <span class="value">张三</span>
        </div>
        <div class="detail-row">
          <span class="label">预估单价</span>
          <span class="value">¥300.00</span>
        </div>
        <div class="detail-row">
          <span class="label">希望送达</span>
          <span class="value">2025-12-24</span>
        </div>
      </div>
    </div>

    <!-- 已撤销物料 -->
    <div class="item-card revoked">
      <div class="item-header" onclick="toggleItem('item2')">
        <div class="name">防护手套（丁腈橡胶，加厚款）超长名称用于测试多行文本溢出处理效果是否合理</div>
        <div class="status-tag">已撤销</div>
        <div class="arrow">▼</div>
      </div>
      <div id="item2" class="item-body">
        <div class="detail-row">
          <span class="label">采购数量</span>
          <span class="value">200 套</span>
        </div>
        <div class="detail-row">
          <span class="label">审核数量</span>
          <input type="number" value="200" min="0" />
        </div>
        <div class="detail-row">
          <span class="label">物料编码</span>
          <span class="value">MAT-60100100003</span>
        </div>
        <div class="detail-row">
          <span class="label">提料人</span>
          <span class="value">李四</span>
        </div>
        <div class="detail-row">
          <span class="label">预估单价</span>
          <span class="value">¥50.00</span>
        </div>
        <div class="detail-row">
          <span class="label">希望送达</span>
          <span class="value">2025-11-30</span>
        </div>
      </div>
    </div>

    <!-- 另一个正常物料 -->
    <div class="item-card">
      <div class="item-header" onclick="toggleItem('item3')">
        <div class="name">反光背心（荧光黄）</div>
        <div class="arrow">▼</div>
      </div>
      <div id="item3" class="item-body">
        <div class="detail-row">
          <span class="label">采购数量</span>
          <span class="value">150 件</span>
        </div>
        <div class="detail-row">
          <span class="label">审核数量</span>
          <input type="number" value="150" min="0" />
        </div>
      </div>
    </div>

  </div>

  <button class="submit-btn">提交审批</button>

  <script>
    function toggleItem(id) {
      const body = document.getElementById(id);
      const arrow = body.previousElementSibling.querySelector('.arrow');
      if (body.classList.contains('active')) {
        body.classList.remove('active');
        arrow.textContent = '▼';
      } else {
        body.classList.add('active');
        arrow.textContent = '▲';
      }
    }

    // 默认展开第一个
    window.addEventListener('DOMContentLoaded', () => {
      const firstBody = document.querySelector('.item-body');
      if (firstBody) {
        firstBody.classList.add('active');
        firstBody.previousElementSibling.querySelector('.arrow').textContent = '▲';
      }
    });
  </script>

</body>
</html>
