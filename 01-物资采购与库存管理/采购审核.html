<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>采购管理APP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2ecc71;
            --warning-color: #f39c12;
            --danger-color: #e74c3c;
            --light-bg: #f8f9fa;
            --card-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            line-height: 1.5;
            padding: 0;
            margin: 0;
        }
        
        .app-container {
            max-width: 100%;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
        }
        
        /* 顶部导航栏 */
        .app-header {
            background: white;
            border-bottom: 1px solid #e5e5e7;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        
        .app-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin: 0;
        }
        
        .header-actions {
            display: flex;
            gap: 12px;
        }
        
        .icon-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            color: #1d1d1f;
            font-size: 1.1rem;
        }
        
        .icon-button:hover {
            background-color: #f5f5f7;
        }
        
        /* 内容区域 */
        .content-area {
            padding: 16px;
        }
        
        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        /* 卡片设计 */
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            margin-bottom: 16px;
            border: none;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .card:active {
            transform: scale(0.98);
        }
        
        .card-header {
            padding: 16px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin: 0;
        }
        
        .status-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .status-completed {
            background-color: #d4edda;
            color: #155724;
        }
        
        .status-in-progress {
            background-color: #fff3cd;
            color: #856404;
        }
        
        .status-pending {
            background-color: #d1ecf1;
            color: #0c5460;
        }
        
        .status-rejected {
            background-color: #f8d7da;
            color: #721c24;
        }
        
        .card-body {
            padding: 16px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .info-label {
            color: #8e8e93;
            font-size: 0.9rem;
        }
        
        .info-value {
            font-weight: 500;
            text-align: right;
        }
        
        .card-footer {
            padding: 12px 16px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        
        /* 按钮设计 */
        .btn {
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }
        
        .btn-success {
            background-color: var(--secondary-color);
            color: white;
        }
        
        .btn-danger {
            background-color: var(--danger-color);
            color: white;
        }
        
        .btn-outline {
            background: transparent;
            border: 1px solid #c7c7cc;
            color: var(--primary-color);
        }
        
        /* 搜索栏 */
        .search-bar {
            position: relative;
            margin-bottom: 16px;
        }
        
        .search-input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border: 1px solid #e5e5e7;
            border-radius: 10px;
            background-color: #f8f9fa;
            font-size: 1rem;
        }
        
        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #8e8e93;
        }
        
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #8e8e93;
        }
        
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        
        /* 响应式设计 */
        @media (min-width: 768px) {
            .app-container {
                max-width: 768px;
                margin: 20px auto;
                min-height: calc(100vh - 40px);
                border-radius: 16px;
                overflow: hidden;
            }
        }
        
        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }
        
        /* 详情视图样式 */
        .detail-view {
            display: none;
        }
        
        .detail-view.active {
            display: block;
        }
        
        .list-view.active {
            display: block;
        }
        
        .list-view {
            display: none;
        }
        
        /* 返回按钮 */
        .back-button {
            display: flex;
            align-items: center;
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 1rem;
            margin-bottom: 16px;
            padding: 8px 0;
        }
        
        .back-button i {
            margin-right: 8px;
        }
        
        /* 物料卡片布局 */
        .material-card {
            border-left: 4px solid var(--primary-color);
            margin-bottom: 16px;
        }
        
        .material-details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .material-detail-item {
            display: flex;
            flex-direction: column;
        }
        
        .material-detail-label {
            font-size: 0.8rem;
            color: #8e8e93;
            margin-bottom: 4px;
        }
        
        .material-detail-value {
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .material-name {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        /* 物料卡片容器 */
        .material-cards-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        /* 签名区域 */
        .signature-area {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #e5e5e7;
        }
        
        .signature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .signature-label {
            font-size: 0.9rem;
            color: #8e8e93;
            margin-bottom: 8px;
        }
        
        .signature-line {
            width: 120px;
            height: 1px;
            background: #8e8e93;
            margin-top: 20px;
        }
        
        /* 物料卡片中的特殊样式 */
        .material-price {
            font-size: 1.1rem;
            font-weight: 600;
            color: #e74c3c;
        }
        
        .material-code {
            font-family: monospace;
            background-color: #f8f9fa;
            padding: 2px 6px;
            border-radius: 4px;
        }
        
        .material-quantity {
            display: inline-block;
            background-color: #e8f4fd;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        @media (max-width: 576px) {
            .material-details-grid {
                grid-template-columns: 1fr;
            }
            
            .signature-area {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 顶部导航栏 -->
        <header class="app-header">
            <h1 class="app-title" id="view-title">采购计划</h1>
            <div class="header-actions">
                <button class="icon-button" id="search-btn">
                    <i class="fas fa-search"></i>
                </button>
                <button class="icon-button" id="filter-btn">
                    <i class="fas fa-filter"></i>
                </button>
            </div>
        </header>
        
        <!-- 内容区域 -->
        <div class="content-area">
            <!-- 搜索栏 -->
            <div class="search-bar" id="search-bar" style="display: none;">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="search-input" placeholder="搜索采购计划...">
            </div>
            
            <!-- 采购计划列表视图 -->
            <div class="list-view active" id="procurement-list-view">
                <div class="section-title">
                    <span>待审核采购计划</span>
                    <span class="text-muted" id="plan-count">5个项目</span>
                </div>
                
                <div id="procurement-cards-container">
                    <!-- 采购计划卡片将通过JavaScript动态生成 -->
                </div>
            </div>
            
            <!-- 物料明细视图 -->
            <div class="detail-view" id="material-detail-view">
                <button class="back-button" id="back-button">
                    <i class="fas fa-arrow-left"></i> 返回采购计划列表
                </button>
                
                <div class="section-title">
                    <span id="detail-plan-title">采购计划详情</span>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title" id="plan-title">XXXXX</h3>
                        <span class="status-badge status-in-progress" id="plan-status">进行中</span>
                    </div>
                    <div class="card-body">
                        <div class="info-row">
                            <span class="info-label">预估总价</span>
                            <span class="info-value" id="info-total">5,000,000.00 元</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">发起时间</span>
                            <span class="info-value" id="info-date">2024-03-07</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">审核天数</span>
                            <span class="info-value" id="info-days">1 天</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">未审核人员</span>
                            <span class="info-value" id="info-pending">张三、李四</span>
                        </div>
                    </div>
                    <div class="card-footer">
                        <button class="btn btn-success" id="approve-plan-btn">
                            <i class="fas fa-check"></i> 审核通过
                        </button>
                        <button class="btn btn-danger" id="reject-plan-btn">
                            <i class="fas fa-times"></i> 拒绝
                        </button>
                    </div>
                </div>
                
                <div class="section-title" style="margin-top: 24px;">
                    <span>物料明细</span>
                    <span class="text-muted" id="material-count">3个物料</span>
                </div>
                
                <!-- 物料卡片容器 -->
                <div class="material-cards-container" id="material-cards-container">
                    <!-- 物料卡片将通过JavaScript动态生成 -->
                </div>
                
                <!-- 签名区域 -->
                <div class="signature-area">
                    <div class="signature-item">
                        <div class="signature-label">项目经理</div>
                        <div class="signature-line"></div>
                    </div>
                    <div class="signature-item">
                        <div class="signature-label">项目物资负责人</div>
                        <div class="signature-line"></div>
                    </div>
                    <div class="signature-item">
                        <div class="signature-label">制表人</div>
                        <div class="signature-line"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 模拟采购计划数据
        const procurementPlans = [
            {
                id: 1,
                title: "XXXXX",
                totalPrice: "5,000,000.00",
                status: "审核完成",
                date: "2024-03-07",
                days: 1,
                pendingReviewers: "",
                materials: []
            },
            {
                id: 2,
                title: "XXXXX",
                totalPrice: "5,000,000.00",
                status: "进行中",
                date: "2024-03-07",
                days: 1,
                pendingReviewers: "张三、李四",
                materials: [
                    {
                        id: 1,
                        name: "geotechnical cloth (土工布) 白色 (white) /2mm厚",
                        code: "71905100002",
                        unit: "m²",
                        quantity: 600,
                        unitPrice: 933,
                        totalPrice: 559800,
                        deliveryTime: "2025-11-15 00:00:00",
                        arrivalPlan: "钢结构杆件防护, 一卷约300平米, 2 卷",
                        actualPrice: "-",
                        supplier: "-",
                        orderNo: "-",
                        applicant: "李长生",
                        purchaseQuantity: 600,
                        reviewQuantity: 600
                    },
                    {
                        id: 2,
                        name: "钢筋 Φ12mm",
                        code: "71905100003",
                        unit: "吨",
                        quantity: 50,
                        unitPrice: 4200,
                        totalPrice: 210000,
                        deliveryTime: "2025-11-20 00:00:00",
                        arrivalPlan: "基础施工使用",
                        actualPrice: "-",
                        supplier: "-",
                        orderNo: "-",
                        applicant: "王明",
                        purchaseQuantity: 50,
                        reviewQuantity: 50
                    },
                    {
                        id: 3,
                        name: "水泥 P.O 42.5",
                        code: "71905100004",
                        unit: "吨",
                        quantity: 100,
                        unitPrice: 380,
                        totalPrice: 38000,
                        deliveryTime: "2025-11-18 00:00:00",
                        arrivalPlan: "混凝土浇筑使用",
                        actualPrice: "-",
                        supplier: "-",
                        orderNo: "-",
                        applicant: "赵强",
                        purchaseQuantity: 100,
                        reviewQuantity: 100
                    }
                ]
            },
            {
                id: 3,
                title: "XXXXX",
                totalPrice: "5,000,000.00",
                status: "未审核",
                date: "2024-03-07",
                days: 1,
                pendingReviewers: "张三、李四、王五",
                materials: []
            },
            {
                id: 4,
                title: "XXXXX",
                totalPrice: "5,000,000.00",
                status: "拒绝",
                date: "2024-03-07",
                days: 1,
                pendingReviewers: "",
                materials: []
            },
            {
                id: 5,
                title: "XXXXX",
                totalPrice: "5,000,000.00",
                status: "进行中",
                date: "2024-03-07",
                days: 1,
                pendingReviewers: "李四、王五",
                materials: []
            }
        ];

        // 当前选中的采购计划ID
        let currentPlanId = null;

        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            renderProcurementCards();
            setupEventListeners();
            updatePlanCount();
        });

        // 渲染采购计划卡片
        function renderProcurementCards() {
            const container = document.getElementById('procurement-cards-container');
            container.innerHTML = '';
            
            procurementPlans.forEach(plan => {
                const statusClass = getStatusClass(plan.status);
                
                const card = document.createElement('div');
                card.className = 'card fade-in';
                card.setAttribute('data-plan-id', plan.id);
                card.innerHTML = `
                    <div class="card-header">
                        <h3 class="card-title">${plan.title}</h3>
                        <span class="status-badge ${statusClass}">${plan.status}</span>
                    </div>
                    <div class="card-body">
                        <div class="info-row">
                            <span class="info-label">预估总价</span>
                            <span class="info-value">${plan.totalPrice} 元</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">发起时间</span>
                            <span class="info-value">${plan.date}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">审核天数</span>
                            <span class="info-value">${plan.days} 天</span>
                        </div>
                        ${plan.pendingReviewers ? `
                        <div class="info-row">
                            <span class="info-label">未审核人员</span>
                            <span class="info-value">${plan.pendingReviewers}</span>
                        </div>
                        ` : ''}
                    </div>
                    <div class="card-footer">
                        <button class="btn btn-primary view-details-btn">
                            <i class="fas fa-eye"></i> 查看明细
                        </button>
                        ${plan.status === '进行中' || plan.status === '未审核' ? `
                        <button class="btn btn-success approve-plan-btn">
                            <i class="fas fa-check"></i> 审核通过
                        </button>
                        <button class="btn btn-danger reject-plan-btn">
                            <i class="fas fa-times"></i> 拒绝
                        </button>
                        ` : ''}
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        // 根据状态获取对应的CSS类
        function getStatusClass(status) {
            switch(status) {
                case '审核完成': return 'status-completed';
                case '进行中': return 'status-in-progress';
                case '未审核': return 'status-pending';
                case '拒绝': return 'status-rejected';
                default: return '';
            }
        }

        // 设置事件监听器
        function setupEventListeners() {
            // 搜索按钮
            document.getElementById('search-btn').addEventListener('click', function() {
                const searchBar = document.getElementById('search-bar');
                searchBar.style.display = searchBar.style.display === 'none' ? 'block' : 'none';
            });
            
            // 返回按钮
            document.getElementById('back-button').addEventListener('click', function() {
                document.getElementById('procurement-list-view').classList.add('active');
                document.getElementById('material-detail-view').classList.remove('active');
                document.getElementById('view-title').textContent = '采购计划';
            });
            
            // 采购计划卡片点击事件
            document.getElementById('procurement-cards-container').addEventListener('click', function(e) {
                if (e.target.closest('.view-details-btn')) {
                    const card = e.target.closest('.card');
                    const planId = parseInt(card.getAttribute('data-plan-id'));
                    showMaterialDetails(planId);
                }
                
                if (e.target.closest('.approve-plan-btn')) {
                    const card = e.target.closest('.card');
                    const planId = parseInt(card.getAttribute('data-plan-id'));
                    approveProcurementPlan(planId);
                }
                
                if (e.target.closest('.reject-plan-btn')) {
                    const card = e.target.closest('.card');
                    const planId = parseInt(card.getAttribute('data-plan-id'));
                    rejectProcurementPlan(planId);
                }
            });
            
            // 审核按钮
            document.getElementById('approve-plan-btn').addEventListener('click', function() {
                if (currentPlanId) {
                    approveProcurementPlan(currentPlanId);
                }
            });
            
            document.getElementById('reject-plan-btn').addEventListener('click', function() {
                if (currentPlanId) {
                    rejectProcurementPlan(currentPlanId);
                }
            });
        }

        // 显示物料详情
        function showMaterialDetails(planId) {
            currentPlanId = planId;
            const plan = procurementPlans.find(p => p.id === planId);
            
            if (!plan) return;
            
            // 更新详情视图
            document.getElementById('detail-plan-title').textContent = plan.title;
            document.getElementById('plan-title').textContent = plan.title;
            document.getElementById('info-total').textContent = plan.totalPrice + ' 元';
            document.getElementById('info-date').textContent = plan.date;
            document.getElementById('info-days').textContent = plan.days + ' 天';
            document.getElementById('info-pending').textContent = plan.pendingReviewers || '无';
            
            // 更新状态
            const statusBadge = document.getElementById('plan-status');
            statusBadge.textContent = plan.status;
            statusBadge.className = `status-badge ${getStatusClass(plan.status)}`;
            
            // 渲染物料卡片
            renderMaterialCards(plan.materials);
            
            // 切换视图
            document.getElementById('procurement-list-view').classList.remove('active');
            document.getElementById('material-detail-view').classList.add('active');
            document.getElementById('view-title').textContent = '物料明细';
        }

        // 渲染物料卡片
        function renderMaterialCards(materials) {
            const container = document.getElementById('material-cards-container');
            container.innerHTML = '';
            
            if (materials.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-box-open"></i>
                        <p>暂无物料信息</p>
                    </div>
                `;
                document.getElementById('material-count').textContent = '0个物料';
                return;
            }
            
            document.getElementById('material-count').textContent = `${materials.length}个物料`;
            
            materials.forEach((material, index) => {
                const card = document.createElement('div');
                card.className = 'card material-card fade-in';
                card.innerHTML = `
                    <div class="card-header">
                        <h3 class="card-title">物料 ${index + 1}</h3>
                    </div>
                    <div class="card-body">
                        <div class="material-name">${material.name}</div>
                        <div class="material-details-grid">
                            <div class="material-detail-item">
                                <span class="material-detail-label">物料编码</span>
                                <span class="material-detail-value material-code">${material.code}</span>
                            </div>
                            <div class="material-detail-item">
                                <span class="material-detail-label">单位</span>
                                <span class="material-detail-value">${material.unit}</span>
                            </div>
                            <div class="material-detail-item">
                                <span class="material-detail-label">本次申请数量</span>
                                <span class="material-detail-value material-quantity">${material.quantity}</span>
                            </div>
                            <div class="material-detail-item">
                                <span class="material-detail-label">采购数量</span>
                                <span class="material-detail-value">${material.purchaseQuantity}</span>
                            </div>
                            <div class="material-detail-item">
                                <span class="material-detail-label">审核数量</span>
                                <span class="material-detail-value">${material.reviewQuantity}</span>
                            </div>
                            <div class="material-detail-item">
                                <span class="material-detail-label">预估单价</span>
                                <span class="material-detail-value">${material.unitPrice} 元</span>
                            </div>
                            <div class="material-detail-item">
                                <span class="material-detail-label">预估总价</span>
                                <span class="material-detail-value material-price">${material.totalPrice} 元</span>
                            </div>
                            <div class="material-detail-item">
                                <span class="material-detail-label">实际单价</span>
                                <span class="material-detail-value">${material.actualPrice}</span>
                            </div>
                            <div class="material-detail-item">
                                <span class="material-detail-label">希望送达</span>
                                <span class="material-detail-value">${material.deliveryTime}</span>
                            </div>
                            <div class="material-detail-item">
                                <span class="material-detail-label">到场计划</span>
                                <span class="material-detail-value">${material.arrivalPlan}</span>
                            </div>
                            <div class="material-detail-item">
                                <span class="material-detail-label">供应商</span>
                                <span class="material-detail-value">${material.supplier}</span>
                            </div>
                            <div class="material-detail-item">
                                <span class="material-detail-label">订单号</span>
                                <span class="material-detail-value">${material.orderNo}</span>
                            </div>
                            <div class="material-detail-item">
                                <span class="material-detail-label">提料人</span>
                                <span class="material-detail-value">${material.applicant}</span>
                            </div>
                        </div>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        // 审核通过采购计划
        function approveProcurementPlan(planId) {
            if (confirm('确定要审核通过这个采购计划吗？')) {
                const plan = procurementPlans.find(p => p.id === planId);
                if (plan) {
                    plan.status = '审核完成';
                    plan.pendingReviewers = '';
                    
                    // 如果当前在详情页面，更新详情页面的状态
                    if (document.getElementById('material-detail-view').classList.contains('active')) {
                        const statusBadge = document.getElementById('plan-status');
                        statusBadge.textContent = plan.status;
                        statusBadge.className = `status-badge ${getStatusClass(plan.status)}`;
                        document.getElementById('info-pending').textContent = '无';
                    }
                    
                    // 更新列表视图
                    renderProcurementCards();
                    updatePlanCount();
                    
                    alert('采购计划已审核通过！');
                }
            }
        }

        // 拒绝采购计划
        function rejectProcurementPlan(planId) {
            if (confirm('确定要拒绝这个采购计划吗？')) {
                const plan = procurementPlans.find(p => p.id === planId);
                if (plan) {
                    plan.status = '拒绝';
                    plan.pendingReviewers = '';
                    
                    // 如果当前在详情页面，更新详情页面的状态
                    if (document.getElementById('material-detail-view').classList.contains('active')) {
                        const statusBadge = document.getElementById('plan-status');
                        statusBadge.textContent = plan.status;
                        statusBadge.className = `status-badge ${getStatusClass(plan.status)}`;
                        document.getElementById('info-pending').textContent = '无';
                    }
                    
                    // 更新列表视图
                    renderProcurementCards();
                    updatePlanCount();
                    
                    alert('采购计划已拒绝！');
                }
            }
        }

        // 更新计划计数
        function updatePlanCount() {
            const pendingPlans = procurementPlans.filter(plan => 
                plan.status === '进行中' || plan.status === '未审核'
            ).length;
            document.getElementById('plan-count').textContent = `${pendingPlans}个项目`;
        }
    </script>
</body>
</html>
