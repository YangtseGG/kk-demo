<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧工地仓储管理系统 - 申领弹窗</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        /* 遮罩层 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        /* 弹窗容器 */
        .claim-dialog {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        
        /* 弹窗头部 */
        .dialog-header {
            background: linear-gradient(135deg, #1e5799 0%, #207cca 100%);
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }
        
        .dialog-title {
            font-size: 22px;
            font-weight: 600;
        }
        
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        /* 内容区域 */
        .dialog-content {
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        /* 库存信息区域 */
        .inventory-info {
            background: #f9fafc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .info-item {
            display: flex;
            flex-direction: column;
        }
        
        .info-label {
            font-size: 14px;
            color: #718096;
            margin-bottom: 6px;
        }
        
        .info-value {
            font-size: 18px;
            font-weight: 600;
            color: #2d3748;
        }
        
        .info-value.warning {
            color: #e67e22;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .warning-icon {
            color: #ffd166;
        }
        
        /* 锁定记录表格 */
        .lock-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
        }
        
        .lock-table th {
            background-color: #edf2f7;
            padding: 12px 15px;
            text-align: left;
            font-size: 14px;
            font-weight: 600;
            color: #4a5568;
        }
        
        .lock-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .lock-table tr:last-child td {
            border-bottom: none;
        }
        
        /* 表单区域 */
        .form-section {
            margin-bottom: 25px;
        }
        
        .section-title {
            font-size: 18px;
            color: #1e5799;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .section-title i {
            font-size: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
        }
        
        .input-container {
            position: relative;
        }
        
        .input-container i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
        }
        
        input, textarea {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            background-color: #f9fafc;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        input:focus, textarea:focus {
            border-color: #1e5799;
            background: white;
            box-shadow: 0 0 0 3px rgba(30, 87, 153, 0.1);
            outline: none;
        }
        
        input:read-only {
            background-color: #edf2f7;
            cursor: not-allowed;
            color: #718096;
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        /* 预算量进度条 */
        .budget-progress {
            margin-top: 15px;
        }
        
        .budget-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .budget-used {
            color: #e67e22;
            font-weight: 600;
        }
        
        .progress-container {
            height: 8px;
            background-color: #edf2f7;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(to right, #48c78e, #1e5799);
            border-radius: 4px;
            width: 4%;
        }
        
        /* 时间选择器 */
        .datetime-picker {
            position: relative;
        }
        
        .datetime-picker i {
            pointer-events: none;
        }
        
        .datetime-picker input[type="date"],
        .datetime-picker input[type="time"] {
            display: inline-block;
            width: calc(50% - 5px);
        }
        
        .datetime-picker input[type="date"] {
            margin-right: 10px;
        }
        
        /* 按钮区域 */
        .dialog-actions {
            padding: 20px;
            background-color: white;
            display: flex;
            gap: 15px;
        }
        
        .dialog-btn {
            flex: 1;
            padding: 16px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .cancel-btn {
            background-color: #f1f4fa;
            color: #718096;
        }
        
        .cancel-btn:hover {
            background-color: #e5eaf1;
        }
        
        .confirm-btn {
            background: linear-gradient(135deg, #1e5799 0%, #207cca 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(30, 87, 153, 0.3);
        }
        
        .confirm-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="modal-overlay">
        <div class="claim-dialog">
            <!-- 弹窗头部 -->
            <div class="dialog-header">
                <div class="dialog-title">申领物料</div>
                <div class="close-btn">
                    <i class="fas fa-times"></i>
                </div>
            </div>
            
            <!-- 内容区域 -->
            <div class="dialog-content">
                <!-- 库存信息 -->
                <div class="inventory-info">
                    <div class="info-grid">
                        <div class="info-item">
                            <span class="info-label">库存数量</span>
                            <span class="info-value">10 pcs</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">可领数量</span>
                            <span class="info-value warning">
                                <i class="fas fa-bolt warning-icon"></i> 2 pcs
                            </span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">锁定数量</span>
                            <span class="info-value">8 pcs</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">安全库存</span>
                            <span class="info-value">5 pcs</span>
                        </div>
                    </div>
                </div>
                
                <!-- 锁定记录表格 -->
                <table class="lock-table">
                    <thead>
                        <tr>
                            <th>姓名</th>
                            <th>锁定业务</th>
                            <th>数量</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>李四</td>
                            <td>申领</td>
                            <td>3 pcs</td>
                        </tr>
                        <tr>
                            <td>张三</td>
                            <td>借用</td>
                            <td>5 pcs</td>
                        </tr>
                        <tr>
                            <td>王五</td>
                            <td>预借</td>
                            <td>2 pcs</td>
                        </tr>
                    </tbody>
                </table>
                
                <!-- 表单区域 -->
                <div class="form-section">
                    <div class="section-title">
                        <i class="fas fa-tasks"></i>
                        <span>申领信息</span>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">申领数量</label>
                        <div class="input-container">
                            <i class="fas fa-cube"></i>
                            <input type="number" min="1" max="2" value="2">
                        </div>
                        <div class="budget-progress">
                            <div class="budget-header">
                                <span>预算量: 1000 pcs</span>
                                <span class="budget-used">已使用: 40 pcs</span>
                            </div>
                            <div class="progress-container">
                                <div class="progress-bar"></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">使用部位</label>
                        <div class="input-container">
                            <i class="fas fa-map-marker-alt"></i>
                            <input type="text" value="A区主体结构 - 第5层" readonly>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">用途备注</label>
                        <div class="input-container">
                            <i class="fas fa-edit"></i>
                            <textarea placeholder="请输入物料用途关键词...">模板支架固定</textarea>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">希望送达时间</label>
                        <div class="datetime-picker">
                            <div class="input-container">
                                <i class="far fa-calendar-alt"></i>
                                <input type="date" value="2024-03-08">
                            </div>
                            <div class="input-container">
                                <i class="far fa-clock"></i>
                                <input type="time" value="15:00">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 按钮区域 -->
            <div class="dialog-actions">
                <button class="dialog-btn cancel-btn">取消</button>
                <button class="dialog-btn confirm-btn">确认申领</button>
            </div>
        </div>
    </div>

    <script>
        // 关闭弹窗功能
        document.querySelector('.close-btn').addEventListener('click', function() {
            document.querySelector('.modal-overlay').style.display = 'none';
        });
        
        document.querySelector('.cancel-btn').addEventListener('click', function() {
            document.querySelector('.modal-overlay').style.display = 'none';
        });
        
        // 申领数量校验
        const claimInput = document.querySelector('input[type="number"]');
        claimInput.addEventListener('input', function() {
            const maxValue = parseInt(this.max);
            let value = parseInt(this.value) || 0;
            
            if (value > maxValue) {
                this.value = maxValue;
            } else if (value < 1) {
                this.value = 1;
            }
        });
    </script>
</body>
</html>
