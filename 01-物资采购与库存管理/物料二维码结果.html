<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物资信息详情</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.5;
            padding: 15px;
        }
        
        .container {
            max-width: 100%;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            padding: 20px 15px;
            position: relative;
        }
        
        .material-name {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .material-code {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .status-badge {
            position: absolute;
            top: 20px;
            right: 15px;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        
        .info-section {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #2c3e50;
            display: flex;
            align-items: center;
        }
        
        .section-title i {
            margin-right: 8px;
            color: #3498db;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .info-item {
            margin-bottom: 12px;
        }
        
        .info-label {
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 4px;
        }
        
        .info-value {
            font-size: 15px;
            font-weight: 500;
        }
        
        .stock-info {
            display: flex;
            justify-content: space-between;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-top: 8px;
        }
        
        .stock-item {
            text-align: center;
            flex: 1;
        }
        
        .stock-value {
            font-size: 20px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        .stock-label {
            font-size: 12px;
            color: #7f8c8d;
        }
        
        .scrap-info {
            display: flex;
            justify-content: space-between;
            background: #fff3cd;
            padding: 12px;
            border-radius: 8px;
            margin-top: 8px;
            border-left: 4px solid #ffc107;
        }
        
        .scrap-item {
            text-align: center;
            flex: 1;
        }
        
        .scrap-value {
            font-size: 20px;
            font-weight: 600;
            color: #856404;
        }
        
        .scrap-label {
            font-size: 12px;
            color: #856404;
        }
        
        .action-buttons {
            display: flex;
            padding: 15px;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .btn {
            flex: 1;
            min-width: 100px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #3498db;
            color: white;
        }
        
        .btn-secondary {
            background: #ecf0f1;
            color: #2c3e50;
        }
        
        .btn-warning {
            background: #f39c12;
            color: white;
        }
        
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .history-section {
            padding: 15px;
        }
        
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .history-item:last-child {
            border-bottom: none;
        }
        
        .history-type {
            font-size: 14px;
            padding: 2px 8px;
            border-radius: 4px;
        }
        
        .type-in {
            background: #d5f4e6;
            color: #27ae60;
        }
        
        .type-out {
            background: #fadbd8;
            color: #e74c3c;
        }
        
        .type-scrap {
            background: #ffeaa7;
            color: #e67e22;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="material-name">不锈钢螺丝 M4×20</div>
            <div class="material-code">物料编号: WL-20230045</div>
            <div class="status-badge">库存正常</div>
        </div>
        
        <div class="info-section">
            <div class="section-title">
                <i>📦</i> 基本信息
            </div>
            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">物料规格</div>
                    <div class="info-value">M4×20mm 不锈钢</div>
                </div>
                <div class="info-item">
                    <div class="info-label">单位</div>
                    <div class="info-value">个</div>
                </div>
                <div class="info-item">
                    <div class="info-label">物料分类</div>
                    <div class="info-value">标准件/螺丝</div>
                </div>
                <div class="info-item">
                    <div class="info-label">供应商</div>
                    <div class="info-value">标准件有限公司</div>
                </div>
            </div>
        </div>
        
        <div class="info-section">
            <div class="section-title">
                <i>📍</i> 位置信息
            </div>
            <div class="info-item">
                <div class="info-label">仓库位置</div>
                <div class="info-value">A区仓库 / 3号货架 / B-05层</div>
            </div>
        </div>
        
        <div class="info-section">
            <div class="section-title">
                <i>📊</i> 库存信息
            </div>
            <div class="stock-info">
                <div class="stock-item">
                    <div class="stock-value">1,250</div>
                    <div class="stock-label">当前库存</div>
                </div>
                <div class="stock-item">
                    <div class="stock-value">1,200</div>
                    <div class="stock-label">可用库存</div>
                </div>
                <div class="stock-item">
                    <div class="stock-value">50</div>
                    <div class="stock-label">锁定库存</div>
                </div>
            </div>
            
            <div class="scrap-info">
                <div class="scrap-item">
                    <div class="scrap-value">25</div>
                    <div class="scrap-label">废旧数量</div>
                </div>
                <div class="scrap-item">
                    <div class="scrap-value">2023-10-05</div>
                    <div class="scrap-label">最近报废日期</div>
                </div>
            </div>
        </div>
        
        <div class="info-section">
            <div class="section-title">
                <i>📋</i> 最近操作记录
            </div>
            <div class="history-list">
                <div class="history-item">
                    <div>
                        <div>出库操作</div>
                        <div style="font-size: 12px; color: #7f8c8d;">2023-10-15 14:30</div>
                    </div>
                    <div class="history-type type-out">-50</div>
                </div>
                <div class="history-item">
                    <div>
                        <div>报废操作</div>
                        <div style="font-size: 12px; color: #7f8c8d;">2023-10-10 09:15</div>
                    </div>
                    <div class="history-type type-scrap">-10</div>
                </div>
                <div class="history-item">
                    <div>
                        <div>入库操作</div>
                        <div style="font-size: 12px; color: #7f8c8d;">2023-10-10 09:15</div>
                    </div>
                    <div class="history-type type-in">+200</div>
                </div>
            </div>
        </div>
        
        <div class="action-buttons">
            <button class="btn btn-primary">入库操作</button>
            <button class="btn btn-secondary">出库操作</button>
            <button class="btn btn-warning">报废操作</button>
            <button class="btn btn-secondary">盘点</button>
        </div>
    </div>

    <script>
        // 添加按钮点击事件处理
        document.addEventListener('DOMContentLoaded', function() {
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach(button => {
                button.addEventListener('click', function() {
                    const buttonText = this.textContent;
                    alert(`执行${buttonText}功能`);
                    // 在实际应用中，这里会调用相应的API或打开对应功能界面
                });
            });
        });
    </script>
</body>
</html>
